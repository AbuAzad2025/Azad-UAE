[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --import-mode=importlib
    --basetemp=tests/.pytest-temp
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    tour: marks end-to-end business flow tour tests (Playwright)
filterwarnings =
    # Deliberate: test_logging_core_second_pass calls warnings.showwarning with
    # this exact message to exercise LoggingCore._capture_warnings. It is test
    # input, not a real deprecation, and it would otherwise pad the CI warning
    # summary. Matched on the message so every other DeprecationWarning stays
    # visible.
    ignore:dep msg:DeprecationWarning
    ignore::DeprecationWarning:flask_caching
    ignore::sqlalchemy.exc.SAWarning
    ignore:The Query\.get\(\) method is considered legacy:DeprecationWarning
    ignore:coroutine 'AsyncMockMixin\.\_execute_mock_call' was never awaited:RuntimeWarning
    ignore:coroutine 'AsyncMockMixin\.\_execute_mock_call' was never awaited:DeprecationWarning
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
    ignore:Invoking or_\(\) without arguments is deprecated:DeprecationWarning
    ignore:Invoking and_\(\) without arguments is deprecated:DeprecationWarning
    ignore:CACHE_TYPE is set to null:UserWarning
    ignore:HarfBuzz-Subset will be required:UserWarning
    ignore::sklearn.exceptions.ConvergenceWarning
