{% extends "base.html" %}

{% block title %}{{ _('Vault Dashboard') }}{% endblock %}

{% block page_title %}
<div class="d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
        <i class="fas fa-vault text-danger mr-3 inline-form"></i>
        <div>
            <h1 class="mb-0"><i class="fas fa-lock"></i> {{ _('Vault Dashboard') }}</h1>
            <p class="text-muted mb-0">{{ _('Manage purchases, donations, and packages') }}</p>
        </div>
    </div>
    <div>
        <form class="needs-validation inline-form" method="POST" action="{{ url_for('payment_vault.trigger_auto_approve') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" aria-label="csrf token">
            <button type="submit" class="btn btn-success mr-2" data-action="confirm-submit" data-confirm-message="{{ _('Trigger auto-approve for oldest operations?') }}">
                <i class="fas fa-check-circle"></i> {{ _('Auto Approve') }}
            </button>
        </form>
        <button data-action="lock-vault" class="btn btn-danger">
            <i class="fas fa-lock"></i> {{ _('Lock Vault') }}
        </button>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style nonce="{{ csp_nonce() }}>
    .stat-card {
        border-radius: 15px;
        padding: 25px;
        color: white;
        box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        transition: all 0.3s;
        cursor: pointer;
    }
    
    .stat-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    
    .stat-number {
        font-size: 2.5rem;
        font-weight: 900;
        margin-bottom: 10px;
    }
    
    .stat-label {
        font-size: 1.1rem;
        opacity: 0.9;
    }
    
    .quick-action {
        background: white;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        transition: all 0.3s;
        cursor: pointer;
        border: 2px solid #e0e0e0;
    }
    
    .quick-action:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        border-color: #667eea;
    }
    
    .quick-action i {
        font-size: 2.5rem;
        margin-bottom: 10px;
    }
    
    .chart-card {
        background: white;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    /* D6: externalized inline styles */
    .inline-form { font-size: 2rem; display: inline; }
    .gradient-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .opacity-80 { opacity: 0.8; }
    .gradient-pink { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    .gradient-blue { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .gradient-green { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
    .font-1-5rem { font-size: 1.5rem; }
  </style>
{% endblock %}

{% block content %}
<div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-card ic-3">
                    <div class="stat-number" id="live-purchases">{{ stats.total_purchases }}</div>
                    <div class="stat-label">
                        <i class="fas fa-shopping-bag"></i> {{ _('Total Purchases') }}
                    </div>
                    <small class="d-block mt-2 ic-4">{{ _('Today') }}: <span id="today-purchases">{{ stats.completed_today or 0 }}</span></small>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="stat-card ic-5">
                    <div class="stat-number" id="live-donations">{{ stats.total_donations }}</div>
                    <div class="stat-label">
                        <i class="fas fa-heart"></i> {{ _('Total Donations') }}
                    </div>
                    <small class="d-block mt-2 ic-4">{{ _('Today') }}: <span id="today-donations">{{ stats.today_transactions or 0 }}</span></small>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="stat-card ic-6">
                    <div class="stat-number" id="live-revenue">{{ currency or 'AED' }} {{ "%.2f"|format(stats.total_revenue) }}</div>
                    <div class="stat-label">
                        <i class="fas fa-dollar-sign"></i> {{ _('Total Revenue') }}
                    </div>
                    <small class="d-block mt-2 ic-4">{{ _('Today') }}: {{ currency or 'AED' }} <span id="today-revenue">{{ "%.2f"|format(stats.today_revenue or 0) }}</span></small>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="stat-card ic-7">
                    <div class="stat-number" id="live-pending">{{ stats.pending_count }}</div>
                    <div class="stat-label">
                        <i class="fas fa-clock"></i> {{ _('Pending') }}
                    </div>
                    <div class="live-indicator mt-2">
                        <span class="badge badge-light"><i class="fas fa-circle text-success"></i> {{ _('Live') }}</span>
                    </div>
                </div>
            </div>
        </div>
        
        
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0"><i class="fas fa-shield-alt"></i> {{ _('Security Status') }}</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="text-center mb-3">
                                    <h3 class="mb-0">
                                        {% if security_status.security_level == 'high' %}
                                            <span class="badge badge-success ic-8"><i class="fas fa-shield-alt"></i> {{ _('High') }}</span>
                                        {% elif security_status.security_level == 'medium' %}
                                            <span class="badge badge-warning ic-8"><i class="fas fa-exclamation-triangle"></i> {{ _('Medium') }}</span>
                                        {% else %}
                                            <span class="badge badge-danger ic-8"><i class="fas fa-bell"></i> {{ _('Low') }}</span>
                                        {% endif %}
                                    </h3>
                                    <p class="text-muted mb-0">{{ _('Security Level') }}</p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <ul class="list-unstyled">
                                    <li><i class="fas fa-ban text-danger"></i> IPs {{ _('Blocked') }}: <strong>{{ security_status.blacklisted_ips }}</strong></li>
                                    <li><i class="fas fa-exclamation-triangle text-warning"></i> {{ _('Failed Attempts') }}: <strong>{{ security_status.failed_attempts }}</strong></li>
                                    <li><i class="fas fa-clock text-info"></i> {{ _('Last Sign In') }}: <strong>{{ vault.last_access.strftime('%H:%M') if vault.last_access else _('N/A') }}</strong></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-users"></i> {{ _('Customer Analysis') }}</h5>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-md-4">
                                <h4 class="text-primary">{{ customer_behavior.total_customers }}</h4>
                                <small class="text-muted">{{ _('Total Customers') }}</small>
                            </div>
                            <div class="col-md-4">
                                <h4 class="text-success">{{ customer_behavior.returning_customers }}</h4>
                                <small class="text-muted">{{ _('Returning Customers') }}</small>
                            </div>
                            <div class="col-md-4">
                                <h4 class="text-warning">{{ customer_behavior.vip_customers }}</h4>
                                <small class="text-muted">{{ _('VIP Customers') }}</small>
                            </div>
                        </div>
                        <hr>
                        <div class="row text-center">
                            <div class="col-md-6">
                                <p class="mb-0"><i class="fas fa-shopping-cart"></i> {{ _('Avg Purchases') }}: <strong>{{ "%.1f"|format(customer_behavior.avg_purchases_per_customer) }}</strong></p>
                            </div>
                            <div class="col-md-6">
                                <p class="mb-0"><i class="fas fa-dollar-sign"></i> {{ _('Avg Spending') }}: <strong>{{ currency or 'AED' }} {{ "%.2f"|format(customer_behavior.avg_spent_per_customer) }}</strong></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        
        <div class="row mb-4">
            <div class="col-12">
                <h4 class="mb-3"><i class="fas fa-bolt text-warning"></i> {{ _('Quick Actions') }}</h4>
            </div>
            
            <div class="col-md-3">
                <div class="quick-action" data-action="navigate" data-url="{{ url_for('payment_vault.view_purchases') }}">
                    <i class="fas fa-shopping-cart text-primary"></i>
                    <h5>{{ _('Manage Purchases') }}</h5>
                    <p class="text-muted mb-0">{{ _('View and manage all purchases') }}</p>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="quick-action" data-action="navigate" data-url="{{ url_for('payment_vault.donations') }}">
                    <i class="fas fa-hand-holding-heart text-danger"></i>
                    <h5>{{ _('Manage Donations') }}</h5>
                    <p class="text-muted mb-0">{{ _('View and manage all donations') }}</p>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="quick-action" data-action="navigate" data-url="{{ url_for('payment_vault.packages_management') }}">
                    <i class="fas fa-box-open text-success"></i>
                    <h5>{{ _('Manage Packages') }}</h5>
                    <p class="text-muted mb-0">{{ _('Add and edit packages') }}</p>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="quick-action" data-action="navigate" data-url="{{ url_for('payment_vault.cards') }}">
                    <i class="fas fa-credit-card text-primary"></i>
                    <h5>{{ _('Saved Cards') }}</h5>
                    <p class="text-muted mb-0">{{ _('View payment cards (encrypted)') }}</p>
                </div>
            </div>
        </div>
        
        
        <div class="row mb-4">
            <div class="col-12">
                <h4 class="mb-3"><i class="fas fa-cog text-info"></i> {{ _('Settings and Reports') }}</h4>
            </div>
            
            <div class="col-md-4">
                <div class="quick-action" data-action="navigate" data-url="{{ url_for('payment_vault.reports') }}">
                    <i class="fas fa-chart-line text-info"></i>
                    <h5>{{ _('Financial Reports') }}</h5>
                    <p class="text-muted mb-0">{{ _('Detailed reports and statistics') }}</p>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="quick-action" data-action="navigate" data-url="{{ url_for('payment_vault.settings') }}">
                    <i class="fas fa-cog text-secondary"></i>
                    <h5>{{ _('Settings') }}</h5>
                    <p class="text-muted mb-0">{{ _('Payment and security settings') }}</p>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="quick-action" data-action="navigate" data-url="{{ url_for('payment_vault.change_password') }}">
                    <i class="fas fa-key text-danger"></i>
                    <h5>{{ _('Change Password') }}</h5>
                    <p class="text-muted mb-0">{{ _('Update vault password') }}</p>
                </div>
            </div>
        </div>
        
        
        <div class="row">
            <div class="col-md-6">
                <div class="chart-card">
                    <h5 class="mb-3">
                        <i class="fas fa-history text-primary"></i> {{ _('Last Purchases') }}
                    </h5>
                    <div class="table-responsive">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>{{ _('Date') }}</th>
                                    <th>{{ _('Customer') }}</th>
                                    <th>{{ _('Plan') }}</th>
                                    <th>{{ _('Amount') }}</th>
                                    <th>{{ _('Status') }}</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% if recent_purchases %}
                                    {% for purchase in recent_purchases %}
                                    <tr>
                                        <td>{{ purchase.created_at.strftime('%Y-%m-%d') }}</td>
                                        <td>{{ purchase.customer_name or _('Unspecified') }}</td>
                                        <td>
                                            {% if purchase.package == 'basic' %}<i class="fas fa-box"></i> {{ _('Basic') }}
                                            {% elif purchase.package == 'professional' %}<i class="fas fa-briefcase"></i> {{ _('Professional') }}
                                            {% elif purchase.package == 'enterprise' %}<i class="fas fa-building"></i> {{ _('Enterprise') }}
                                            {% else %}{{ purchase.package }}
                                            {% endif %}
                                        </td>
                                        <td><strong>{{ currency or 'AED' }} {{ purchase.amount_usd }}</strong></td>
                                        <td>
                                            {% if purchase.status == 'completed' %}
                                                <span class="badge badge-success"><i class="fas fa-check"></i> {{ _('Completed') }}</span>
                                            {% elif purchase.status == 'pending' %}
                                                <span class="badge badge-warning"><i class="fas fa-hourglass-half"></i> {{ _('Pending') }}</span>
                                            {% else %}
                                                <span class="badge badge-secondary">{{ purchase.status }}</span>
                                            {% endif %}
                                        </td>
                                    </tr>
                                    {% endfor %}
                                {% else %}
                                    <tr>
                                        <td colspan="5" class="text-center text-muted">{{ _('No purchases found') }}</td>
                                    </tr>
                                {% endif %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="chart-card">
                    <h5 class="mb-3">
                        <i class="fas fa-heart text-danger"></i> {{ _('Last Donations') }}
                    </h5>
                    <div class="table-responsive">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>{{ _('Date') }}</th>
                                    <th>{{ _('Donor') }}</th>
                                    <th>{{ _('Amount') }}</th>
                                    <th>{{ _('Currency') }}</th>
                                    <th>{{ _('Status') }}</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% if recent_donations %}
                                    {% for donation in recent_donations %}
                                    <tr>
                                        <td>{{ donation.created_at.strftime('%Y-%m-%d') }}</td>
                                        <td>{{ donation.donor_name or _('Anonymous') }}</td>
                                        <td><strong>{{ currency or 'AED' }} {{ donation.amount_usd }}</strong></td>
                                        <td>{{ donation.crypto_type|upper }}</td>
                                        <td>
                                            {% if donation.status == 'completed' %}
                                                <span class="badge badge-success"><i class="fas fa-check"></i></span>
                                            {% else %}
                                                <span class="badge badge-warning"><i class="fas fa-hourglass-half"></i></span>
                                            {% endif %}
                                        </td>
                                    </tr>
                                    {% endfor %}
                                {% else %}
                                    <tr>
                                        <td colspan="5" class="text-center text-muted">{{ _('No donations found') }}</td>
                                    </tr>
                                {% endif %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        
        
        <div class="row mt-4">
            <div class="col-12">
                <div class="chart-card">
                    <h5 class="mb-3">
                        <i class="fas fa-chart-area text-success"></i> {{ _('Monthly Revenue') }}
                    </h5>
                    <canvas id="revenueChart" height="80"></canvas>
                </div>
            </div>
        </div>
        
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='adminlte/plugins/chartjs/chart.min.js') }}"></script>
<script nonce="{{ csp_nonce() }}>
    document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-action]');
        if (!el) return;
        const action = el.dataset.action;
        if (action === 'confirm-submit') {
            if (!confirm(el.dataset.confirmMessage)) e.preventDefault();
        } else if (action === 'lock-vault') lockVault();
        else if (action === 'navigate') window.location.href = el.dataset.url;
    });

    // Revenue Chart
    const ctx = document.getElementById('revenueChart').getContext('2d');
    const chartConfig = {{ chart_data | tojson }};
    new Chart(ctx, chartConfig);
    
    function lockVault() {
        fetch('{{ url_for("payment_vault.lock_vault") }}', {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token() }}',
                'Content-Type': 'application/json'
            }
        }).then(r => r.json()).then(data => {
            if (data.success) {
                location.reload();
            } else {
                Swal.fire('{{ _("Error") }}', data.error || '{{ _("Failed to lock vault") }}', 'error');
            }
        }).catch(() => {
            Swal.fire('{{ _("Error") }}', '{{ _("Network error") }}', 'error');
        });
    }
    
    // {{ _('Live statistics update every 30 seconds') }}
    setInterval(async () => {
        try {
            const response = await fetch('{{ url_for("payment_vault.api_live_stats") }}');
            const data = await response.json();
            
            if (data.success) {
                document.getElementById('today-revenue').textContent = data.daily_revenue.toFixed(2);
                document.getElementById('today-donations').textContent = data.daily_transactions;
                document.getElementById('live-pending').textContent = data.pending_count;            }
        } catch (error) {        }
    }, 30000); // {{ _('Every 30 seconds') }}
    
    // {{ _('Fetch new notifications') }}
    async function fetchNotifications() {
        try {
            const response = await fetch('{{ url_for("payment_vault.api_notifications") }}?limit=5');
            const data = await response.json();
            
            if (data.success && data.notifications.length > 0) {
                const latest = data.notifications[data.notifications.length - 1];
                if (!latest.read) {
                    showNotification(latest.title, latest.message, latest.type);
                }
            }
        } catch (error) {        }
    }
    
    // {{ _('View notification') }}
    function showNotification(title, message, type = 'info') {
        const icon = type === 'danger' ? 'error' : type === 'success' ? 'success' : 'info';
        
        Swal.fire({
            title: title,
            text: message,
            icon: icon,
            timer: 5000,
            showConfirmButton: false,
            toast: true,
            position: 'top-end',
            timerProgressBar: true
        });
    }
    
    // {{ _('Check notifications every minute') }}
    setInterval(fetchNotifications, 60000);
    
    // {{ _('Smooth effect on page load') }}
    document.addEventListener('DOMContentLoaded', () => {
        const cards = document.querySelectorAll('.stat-card, .quick-action');
        cards.forEach((card, index) => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            setTimeout(() => {
                card.style.transition = 'all 0.5s ease';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, index * 100);
        });    });
</script>
{% endblock %}
