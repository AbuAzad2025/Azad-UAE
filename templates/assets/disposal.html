{% extends 'base.html' %}
{% block title %}{{ t('Dispose') }} - {{ asset.asset_number }}{% endblock %}
{% block content %}
<div class="container py-4">
  <h2 class="mb-4">{{ t('Dispose Asset') }}: {{ asset.asset_number }} - {{ asset.name_ar }}</h2>
  <div class="alert alert-warning">{{ t('This action cannot be undone.') }}</div>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
      <div class="col-md-4"><label class="form-label">{{ t('Disposal Date') }} *</label><input type="date" name="disposal_date" class="form-control" required></div>
      <div class="col-md-4"><label class="form-label">{{ t('Disposal Price') }}</label><input type="number" step="0.001" name="disposal_price" class="form-control" value="0"></div>
      <div class="col-md-12"><label class="form-label">{{ t('Notes') }}</label><textarea name="notes" class="form-control" rows="2"></textarea></div>
    </div>
    <div class="mt-4">
      <button type="submit" class="btn btn-danger btn-lg">{{ t('Confirm Disposal') }}</button>
      <a href="{{ url_for('assets.detail', asset_id=asset.id) }}" class="btn btn-secondary btn-lg">{{ t('Cancel') }}</a>
    </div>
  </form>
</div>
{% endblock %}
