{% extends 'base.html' %}
{% block title %}{{ _('Print_Settings') }}{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title mb-0"><i class="fas fa-print mr-2"></i>{{ _('Print_Settings') }}</h3>
    </div>
    <div class="card-body">
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row">
          <div class="col-md-6">
            <h5 class="mb-3"><i class="fas fa-file mr-2"></i>{{ _('Paper_Settings') }}</h5>
            <div class="form-group">
              <label for="paper_size">{{ _('Paper_Size') }}</label>
              <select name="paper_size" id="paper_size" class="form-control">
                <option value="A4" {{ 'selected' if settings.paper_size == 'A4' }}>A4</option>
                <option value="A5" {{ 'selected' if settings.paper_size == 'A5' }}>A5</option>
                <option value="Letter" {{ 'selected' if settings.paper_size == 'Letter' }}>Letter</option>
              </select>
            </div>
            <div class="form-group">
              <label for="orientation">{{ _('Print_Orientation') }}</label>
              <select name="orientation" id="orientation" class="form-control">
                <option value="portrait" {{ 'selected' if settings.orientation == 'portrait' }}>{{ _('Portrait') }}</option>
                <option value="landscape" {{ 'selected' if settings.orientation == 'landscape' }}>{{ _('Landscape') }}</option>
              </select>
            </div>
            <div class="form-group">
              <label for="active_template">{{ _('Active_Template') }}</label>
              <select name="active_template" id="active_template" class="form-control">
                <option value="modern" {{ 'selected' if settings.active_template == 'modern' }}>{{ _('Modern') }}</option>
                <option value="classic" {{ 'selected' if settings.active_template == 'classic' }}>{{ _('Classic') }}</option>
                <option value="gulf" {{ 'selected' if settings.active_template == 'gulf' }}>{{ _('Gulf') }}</option>
                <option value="simple" {{ 'selected' if settings.active_template == 'simple' }}>{{ _('Simple') }}</option>
                <option value="minimal" {{ 'selected' if settings.active_template == 'minimal' }}>{{ _('Minimal') }}</option>
              </select>
            </div>
          </div>
          <div class="col-md-6">
            <h5 class="mb-3"><i class="fas fa-palette mr-2"></i>{{ _('Colors') }}</h5>
            <div class="form-group">
              <label for="header_color">{{ _('Header_Color') }}</label>
              <input type="color" name="header_color" id="header_color" class="form-control form-control-color" value="{{ settings.header_color or '#667eea' }}" style="height:50px;">
            </div>
            <div class="form-group">
              <label for="accent_color">{{ _('Accent_Color') }}</label>
              <input type="color" name="accent_color" id="accent_color" class="form-control form-control-color" value="{{ settings.accent_color or '#764ba2' }}" style="height:50px;">
            </div>
          </div>
        </div>

        <hr>
        <h5 class="mb-3"><i class="fas fa-cog mr-2"></i>{{ _('Print_Options') }}</h5>
        <div class="row">
          <div class="col-md-4">
            <div class="custom-control custom-switch">
              <input type="checkbox" class="custom-control-input" id="show_logo" name="show_logo" {{ 'checked' if settings.show_logo }}>
              <label class="custom-control-label" for="show_logo">{{ _('Show_Logo') }}</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="custom-control custom-switch">
              <input type="checkbox" class="custom-control-input" id="enable_qr_code" name="enable_qr_code" {{ 'checked' if settings.enable_qr_code }}>
              <label class="custom-control-label" for="enable_qr_code">{{ _('QR_Code') }}</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="custom-control custom-switch">
              <input type="checkbox" class="custom-control-input" id="enable_watermark" name="enable_watermark" {{ 'checked' if settings.enable_watermark }}>
              <label class="custom-control-label" for="enable_watermark">{{ _('Watermark') }}</label>
            </div>
          </div>
          <div class="col-md-4 mt-3">
            <div class="custom-control custom-switch">
              <input type="checkbox" class="custom-control-input" id="show_terms" name="show_terms" {{ 'checked' if settings.show_terms }}>
              <label class="custom-control-label" for="show_terms">{{ _('Show_Terms_And_Conditions') }}</label>
            </div>
          </div>
        </div>

        <hr>
        <div class="text-center">
          <button type="submit" class="btn btn-primary btn-lg px-5">
            <i class="fas fa-save mr-2"></i> {{ _('Save') }} {{ _('Settings') }}
          </button>
          <a href="{{ url_for('printing.settings') }}" class="btn btn-secondary btn-lg px-5 mr-2">{{ _('Cancel') }}</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
