{% extends 'base.html' %}
{% block title %}{{ t('New_Campaign') }}{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="card">
    <div class="card-header"><h5><i class="fas fa-bullhorn"></i> {{ t('New_Campaign') }}</h5></div>
    <div class="card-body">
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group"><label for="campaign_name">{{ t('Name') }}</label><input name="name" id="campaign_name" class="form-control" required></div>
        <div class="row">
          <div class="col-md-6">
            <div class="form-group"><label for="campaign_list_id">{{ t('Email_List') }}</label>
              <select name="list_id" id="campaign_list_id" class="form-control" aria-label="{{ t('Email_List') }}">
                <option value="">{{ t('Select') }}</option>
                {% for l in lists %}
                <option value="{{ l.id }}">{{ l.name }}</option>
                {% endfor %}
              </select></div>
          </div>
          <div class="col-md-6">
            <div class="form-group"><label for="campaign_template_id">{{ t('Template') }}</label>
              <select name="template_id" id="campaign_template_id" class="form-control" aria-label="{{ t('Template') }}">
                <option value="">{{ t('Select') }}</option>
                {% for tpl in templates %}
                <option value="{{ tpl.id }}">{{ tpl.name }}</option>
                {% endfor %}
              </select></div>
          </div>
        </div>
        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> {{ t('Save') }}</button>
        <a href="{{ url_for('email_marketing.campaigns') }}" class="btn btn-secondary">{{ t('Cancel') }}</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
