{% macro badge_required() %}<span class="badge badge-danger mr-1">{{ t('Required') }}</span>{% endmacro %}
{% macro badge_optional() %}<span class="badge badge-secondary mr-1">{{ t('Optional') }}</span>{% endmacro %}
{% macro badge_auto() %}<span class="badge badge-info mr-1">{{ t('Auto_If_Empty') }}</span>{% endmacro %}
{% macro badge_conditional(text) %}<span class="badge badge-warning mr-1">{{ text }}</span>{% endmacro %}
