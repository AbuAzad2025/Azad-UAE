{% extends 'layouts/base_pos.html' %}
{% block title %}{{ _('شاشة المطبخ') }}{% endblock %}
{% block extra_css %}
<style nonce="{{ csp_nonce() }}">
.kds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 8px 0; }
.kds-card { border-radius: 8px; padding: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.1); transition: all .2s; }
.kds-card.pending { background: #fff3cd; border-right: 6px solid #ffc107; }
/* purgecss start ignore */
.kds-card.preparing { background: #cce5ff; border-right: 6px solid #007bff; }
/* purgecss end ignore */
.kds-card.ready { background: #d4edda; border-right: 6px solid #28a745; }
/* purgecss start ignore */
.kds-card.served { opacity: .5; }
/* purgecss end ignore */
.kds-card.cancelled { opacity: .4; }
.kds-card h4 { margin: 0 0 8px; font-size: 1.1rem; }
.kds-items { font-size: .95rem; }
.kds-items li { padding: 2px 0; }
.kds-actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.kds-actions .btn { font-size: .8rem; padding: 4px 10px; }
</style>
{% endblock %}
{% block content %}
<div class="mb-3">
  <div class="btn-group btn-group-sm">
    <button class="btn btn-outline-secondary filter-btn active" data-filter="all">{{ _('الكل') }}</button>
    <button class="btn btn-outline-warning filter-btn" data-filter="pending">{{ _('معلق') }}</button>
    <button class="btn btn-outline-primary filter-btn" data-filter="preparing">{{ _('قيد التحضير') }}</button>
    <button class="btn btn-outline-success filter-btn" data-filter="ready">{{ _('جاهز') }}</button>
  </div>
  <button id="kdsRefreshBtn" class="btn btn-sm btn-outline-info float-left" aria-label="{{ _('تحديث') }}"><i class="fas fa-sync-alt" aria-hidden="true"></i></button>
</div>
<div id="kdsGrid" class="kds-grid">
  <div class="text-center text-muted py-5 col-12"><i class="fas fa-spinner fa-spin fa-2x" aria-hidden="true"></i><br>{{ _('جاري التحميل...') }}</div>
</div>
{% endblock %}
{% block extra_js %}
<script nonce="{{ csp_nonce() }}">
(()=> {
  const grid = document.getElementById('kdsGrid');
  let currentFilter = 'all';

  function loadOrders() {
    fetch('/pos/api/kds/orders').then(r=>r.json()).then(orders=>{
      renderOrders(orders);
    }).catch(()=>{
      grid.innerHTML = '<div class="text-center text-muted py-5 col-12">{{ _('فشل التحميل') }}</div>';
    });
  }

  // Everything interpolated below reaches innerHTML, so every one of these
  // fields has to be escaped first. o.items[].name is a product-master name and
  // i.notes is free text from the POS cart line - both are attacker-controllable
  // by anyone who can create or edit a product, and this screen is opened on
  // every kitchen terminal and by every supervisor. i.quantity is a number from
  // our own API but is escaped too rather than trusted by type.
  // Follows the session language like every other surface, instead of a pinned
  // 'ar-SA'. Pinning it meant an English user got Arabic-Indic digits, and in
  // Chromium ar-SA also resolves to the islamic-umalqura calendar, so the
  // kitchen screen could show Hijri dates regardless of the language chosen.
  const KDS_TIME_LOCALE = (window.I18N_LANG || '{{ current_language or "ar" }}') === 'ar' ? 'ar' : 'en-GB';

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function renderOrders(orders) {
    const filtered = currentFilter === 'all' ? orders : orders.filter(o => o.status === currentFilter);
    if (!filtered.length) {
      grid.innerHTML = '<div class="text-center text-muted py-5 col-12">{{ _('لا توجد طلبات') }}</div>';
      return;
    }
    grid.innerHTML = filtered.map(o => `
      <div class="kds-card ${esc(o.status)}" data-status="${esc(o.status)}">
        <h4>#${esc(o.order_number)} <span class="badge badge-${statusBadge(o.status)} float-left">${esc(statusLabel(o.status))}</span></h4>
        <div class="text-muted small mb-2">${esc(new Date(o.created_at).toLocaleTimeString(KDS_TIME_LOCALE))}</div>
        <ul class="kds-items list-unstyled mb-0">
          ${(o.items||[]).map(i => `<li>${esc(i.quantity)} x ${esc(i.name)}${i.notes ? ' <span class="text-muted">('+esc(i.notes)+')</span>' : ''}</li>`).join('')}
        </ul>
        <div class="kds-actions">
          ${actionButtons(o)}
        </div>
      </div>
    `).join('');
  }

  function statusLabel(s) { return {pending:'{{ _("معلق") }}',preparing:'{{ _("قيد التحضير") }}',ready:'{{ _("جاهز") }}',served:'{{ _("تم التقديم") }}',cancelled:'{{ _("ملغي") }}'}[s]||s; }
  function statusBadge(s) { return {pending:'warning',preparing:'primary',ready:'success',served:'secondary',cancelled:'danger'}[s]||'secondary'; }

  function actionButtons(o) {
    const btns = [];
    // o.id is escaped for the same reason: it is concatenated into an attribute
    // inside an HTML string, so an unescaped quote would break out of it.
    const id = esc(o.id);
    if (o.status === 'pending') btns.push('<button class="btn btn-primary btn-sm status-btn" data-id="'+id+'" data-status="preparing">{{ _("قيد التحضير") }}</button>');
    if (o.status === 'preparing') btns.push('<button class="btn btn-success btn-sm status-btn" data-id="'+id+'" data-status="ready">{{ _("جاهز") }}</button>');
    if (o.status === 'ready') btns.push('<button class="btn btn-secondary btn-sm status-btn" data-id="'+id+'" data-status="served">{{ _("تم التقديم") }}</button>');
    if (!['served','cancelled'].includes(o.status)) btns.push('<button class="btn btn-danger btn-sm status-btn" data-id="'+id+'" data-status="cancelled">{{ _("ملغي") }}</button>');
    return btns.join('');
  }

  grid.addEventListener('click', (e)=> {
    const btn = e.target.closest('.status-btn');
    if (!btn) return;
    const orderId = btn.dataset.id;
    const status = btn.dataset.status;
    fetch('/pos/api/kds/orders/'+orderId+'/status', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
      },
      body: JSON.stringify({status})
    }).then(r=>r.json()).then(d=>{ if(d.success) loadOrders(); });
  });

  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click', function(){
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      this.classList.add('active');
      currentFilter = this.dataset.filter;
      loadOrders();
    });
  });

  document.getElementById('kdsRefreshBtn').addEventListener('click', loadOrders);

  function connectSSE() {
    const es = new EventSource('/pos/api/kds/stream');
    es.onmessage = (e) => {
      try { const d = JSON.parse(e.data); if (d.type) loadOrders(); } catch(ex) {}
    };
    es.onerror = () => { es.close(); setTimeout(connectSSE, 3000); };
  }

  loadOrders();
  connectSSE();
  setInterval(loadOrders, 30000);
})();
</script>
{% endblock %}
