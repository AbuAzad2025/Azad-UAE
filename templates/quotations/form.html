{% extends 'base.html' %}
{% block title %}{{ t('Quotation') }}{% endblock %}
{% block content %}
<div class="container-fluid py-4">
  <h2>{{ t('Edit Quotation') if quotation else t('New Quotation') }}</h2>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label" for="f_customer_id">{{ t('Customer') }} *</label>
            <select name="customer_id" class="form-select" required id="f_customer_id">
              <option value="">{{ t('Select') }}</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label" for="f_expiry_date">{{ t('Expiry Date') }}</label>
            <input type="date" name="expiry_date" class="form-control" value="{{ quotation.expiry_date if quotation and quotation.expiry_date else '' }}" id="f_expiry_date">
          </div>
          <div class="col-md-2">
            <label class="form-label" for="f_currency">{{ t('Currency') }}</label>
            <input type="text" name="currency" class="form-control" value="{{ quotation.currency if quotation else 'AED' }}" id="f_currency">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="f_notes">{{ t('Notes') }}</label>
            <textarea name="notes" class="form-control" rows="2" id="f_notes">{{ quotation.notes if quotation else '' }}</textarea>
          </div>
          <div class="col-md-12">
            <label class="form-label" for="f_terms">{{ t('Terms & Conditions') }}</label>
            <textarea name="terms" class="form-control" rows="2" id="f_terms">{{ quotation.terms if quotation else '' }}</textarea>
          </div>
        </div>
      </div>
    </div>
    <div class="card mb-4">
      <div class="card-header"><h5>{{ t('Lines') }}</h5></div>
      <div class="card-body">
        <div id="lines-container"></div>
        <button type="button" class="btn btn-sm btn-outline-secondary mt-2" onclick="addLine()"><i class="fas fa-plus" aria-hidden="true"></i> {{ t('Add Line') }}</button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">{{ t('Save') }}</button>
    <a href="{{ url_for('quotations.index') }}" class="btn btn-secondary">{{ t('Cancel') }}</a>
  </form>
</div>
{% endblock %}
