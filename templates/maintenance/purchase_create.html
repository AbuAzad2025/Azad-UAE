{% extends 'base.html' %}
{% block title %}{{ t('New Purchase Order') }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ dist_url('css/maintenance.css') }}">
{% endblock %}

{% block content %}
<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0"><i class="fas fa-cart-arrow-down mr-2" aria-hidden="true"></i>{{ t('New Purchase Order') }}</h2>
    <a href="{{ url_for('maintenance.purchases') }}" class="btn btn-outline-secondary">
      <i class="fas fa-arrow-left mr-1" aria-hidden="true"></i>{{ t('Back') }}
    </a>
  </div>

  <form method="POST" action="{{ url_for('maintenance.create_purchase') }}" class="needs-validation" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="card mb-4">
      <div class="card-header"><h3 class="card-title mb-0">{{ t('Supplier and Warehouse') }}</h3></div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="mntPoSupplier">{{ t('Supplier') }}</label>
            <select class="form-select" id="mntPoSupplier" name="supplier_id">
              <option value="">{{ t('Select') }}</option>
              {% for supplier in suppliers %}
              <option value="{{ supplier.id }}">{{ supplier.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="mntPoWarehouse">{{ t('Warehouse') }}</label>
            <select class="form-select" id="mntPoWarehouse" name="warehouse_id" required>
              <option value="">{{ t('Select') }}</option>
              {% for warehouse in warehouses %}
              <option value="{{ warehouse.id }}">{{ warehouse.name_ar or warehouse.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="mntPoTaxRate">{{ t('Tax Rate') }}</label>
            <input type="number" step="0.01" min="0" max="100" class="form-control" id="mntPoTaxRate"
                   name="tax_rate" value="0">
          </div>
          <div class="col-md-8">
            <label class="form-label" for="mntPoNotes">{{ t('Notes') }}</label>
            <input type="text" class="form-control" id="mntPoNotes" name="notes" maxlength="500">
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body d-flex justify-content-end gap-2">
        <a href="{{ url_for('maintenance.purchases') }}" class="btn btn-outline-secondary">{{ t('Cancel') }}</a>
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-check mr-1" aria-hidden="true"></i>{{ t('Create') }}
        </button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
