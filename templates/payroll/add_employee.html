{% extends 'base.html' %}
{% block title %}{{ _('إضافة موظف') }}{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="card">
    <div class="card-header bg-gradient-purple text-white">
      <h3><i class="fas fa-user-plus" aria-hidden="true"></i> {{ _('إضافة موظف جديد') }}</h3>
    </div>
    <div class="card-body">
      <form class="needs-validation" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" aria-label="csrf token">
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="input_name">{{ _('الاسم الكامل (إنجليزي)') }}</label>
                    <input type="text" name="name" class="form-control" required id="input_name" aria-label="name" minlength="2" maxlength="100">
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label for="input_name_ar">{{ _('الاسم بالعربية') }}</label>
                    <input type="text" name="name_ar" class="form-control" id="input_name_ar" aria-label="name ar" minlength="2" maxlength="100">
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-4">
                <div class="form-group">
                    <label for="input_phone">{{ _('الهاتف') }}</label>
                    <input type="text" name="phone" class="form-control" id="input_phone" aria-label="phone" pattern="^\+?[0-9\s\-]{8,20}$">
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label>{{ _('الفرع') }} <span class="text-danger">*</span></label>
                    <select name="branch_id" class="form-control" required aria-label="{{ _('اختر الفرع') }}">
                        <option value="">-- {{ _('اختر الفرع') }} --</option>
                        {% for branch in branches %}
                        <option value="{{ branch.id }}">{{ branch.name }}</option>
                        {% endfor %}
                    </select>
                    <small class="text-muted">{{ _('مطلوب لكل موظف.') }}</small>
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label for="input_joined_date">{{ _('تاريخ الانضمام') }}</label>
                    <input type="date" name="joined_date" class="form-control" value="{{ now().strftime('%Y-%m-%d') }}" id="input_joined_date" aria-label="joined date">
                </div>
            </div>
        </div>
        
        <hr>
        
        <div class="row">
            <div class="col-md-4">
                <div class="form-group">
                    <label>{{ _('نظام الدفع') }}</label>
                    <select name="employment_type" class="form-control" aria-label="employment type">
                        <option value="salary">{{ _('راتب شهري') }}</option>
                        <option value="daily">{{ _('مياومة') }}</option>
                    </select>
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label for="input_basic_salary">{{ _('القيمة الأساسية') }}</label>
                    <input type="number" step="0.01" name="basic_salary" class="form-control" placeholder="{{ _('الراتب الشهري أو الأجرة اليومية') }}" required id="input_basic_salary" min="0">
                </div>
            </div>
        </div>
        
        <button type="submit" class="btn btn-success"><i class="fas fa-save" aria-hidden="true"></i> {{ _('حفظ') }}</button>
        <a href="{{ url_for('payroll.employees_list') }}" class="btn btn-secondary">{{ _('إلغاء') }}</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
