<!-- DataTables CSS (async load; nonce script replaces inline onload for CSP) -->
<link rel="preload" href="{{ url_for('static', filename='adminlte/plugins/datatables-bs4/css/dataTables.bootstrap4.min.css') }}" as="style">
<link rel="preload" href="{{ url_for('static', filename='adminlte/plugins/datatables-buttons/css/buttons.bootstrap4.min.css') }}" as="style">

<link rel="stylesheet" href="{{ url_for('static', filename='adminlte/plugins/datatables-bs4/css/dataTables.bootstrap4.min.css') }}" media="print" class="dt-async-css">
<link rel="stylesheet" href="{{ url_for('static', filename='adminlte/plugins/datatables-buttons/css/buttons.bootstrap4.min.css') }}" media="print" class="dt-async-css">
<script nonce="{{ csp_nonce() }}">
  (function () {
    var activate = function (l) { l.media = 'all'; };
    Array.prototype.forEach.call(document.querySelectorAll('link.dt-async-css'), function (l) {
      try {
        if (l.sheet) { activate(l); } else { l.addEventListener('load', function () { activate(l); }); }
      } catch (e) { activate(l); }
    });
  })();
</script>

<noscript>
  <link rel="stylesheet" href="{{ url_for('static', filename='adminlte/plugins/datatables-bs4/css/dataTables.bootstrap4.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='adminlte/plugins/datatables-buttons/css/buttons.bootstrap4.min.css') }}">
</noscript>
