<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ 'ltr' if is_en else 'rtl' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t('Thank_You') }} — Azad</title>
  <link rel="stylesheet" href="{{ dist_url('css/azad-donation-palestine.css') }}">
  <style nonce="{{ csp_nonce() }}">
    /* D6: externalized inline styles */
    .ic-1 { text-align:center; padding-top:4rem; }
    .ic-2 { display:inline-block; width:auto; padding:0.75rem 2rem; text-decoration:none; margin-top:1rem; }
  </style>
</head>
<body class="az-donate {{ 'ltr' if is_en else 'rtl' }}">
  <div class="az-donate-bg">
    <div class="az-tatreez-top"></div>
    <div class="az-wrap ic-1">
      <div class="az-emblem"><i class="fas fa-check"></i></div>
      <h1 class="az-title">{{ t('Donation_Received') }}</h1>
      <p class="az-intro">#{{ donation.id }} · ${{ '%.2f'|format(donation.amount_usd) }}</p>
      <p class="az-intro">{{ t('Donation_Confirmation_Message') }}</p>
      <a href="{{ url_for('public.landing') }}" class="az-btn ic-2">{{ t('Home') }}</a>
    </div>
  </div>
</body>
</html>
