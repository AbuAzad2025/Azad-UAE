<!DOCTYPE html>
<html lang="{{ current_language }}" dir="{{ 'rtl' if is_rtl else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Azad IntelliTech - Pricing & Plans') }}</title>
    <meta name="description" content="{{ _('Choose the right plan for your business. No hidden fees.') }}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ url_for('public.pricing', _external=True) }}">
    {% if is_en %}
    <link rel="alternate" hreflang="en" href="{{ url_for('public.pricing', _external=True, lang='en') }}">
    {% else %}
    <link rel="alternate" hreflang="ar" href="{{ url_for('public.pricing', _external=True, lang='ar') }}">
    {% endif %}
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='adminlte/plugins/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ dist_url('css/accessibility.css') }}">
    <link rel="stylesheet" href="{{ dist_url('css/landing.css') }}">
    <link rel="stylesheet" href="{{ dist_url('css/brand.css') }}">
    <style nonce="{{ csp_nonce() }}">
        :root {
            --azad-bg: #070b14;
            --azad-surface: #0f1724;
            --azad-card: rgba(18, 27, 46, 0.75);
            --azad-border: rgba(212, 160, 23, 0.10);
            --azad-accent: #d4a017;
            --azad-accent-light: #e8c45a;
            --azad-accent-glow: rgba(212, 160, 23, 0.25);
            --azad-text: #e8edf5;
            --azad-text-secondary: #b0bcc8;
            --azad-text-muted: #7a8799;
            --azad-radius: 20px;
            --azad-glass: rgba(15, 23, 36, 0.75);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', 'Inter', sans-serif; background: var(--azad-bg); color: var(--azad-text); min-height: 100vh; line-height: 1.6; }
        a { text-decoration: none; }
        /* ── NAV ── */
        .azad-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 14px 0; transition: all 0.3s; }
        /* purgecss start ignore */
        .azad-nav.scrolled { background: rgba(7,11,20,0.92); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(212,160,23,0.06); }
        /* purgecss end ignore */
        .azad-nav-inner { max-width: 1260px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 24px; }
        .azad-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .azad-brand img { width: 38px; height: 38px; border-radius: 10px; object-fit: contain; }
        .azad-brand-text { font-weight: 800; font-size: 1rem; color: var(--azad-text); letter-spacing: -0.02em; }
        .azad-brand-tagline { font-size: 0.65rem; color: var(--azad-text-muted); display: block; letter-spacing: 0.02em; }
        .azad-nav-links { display: flex; align-items: center; gap: 4px; }
        .azad-nav-links a { color: var(--azad-text-muted); padding: 8px 12px; font-size: 0.85rem; font-weight: 500; border-radius: 10px; transition: all 0.2s; }
        .azad-nav-links a:hover { color: var(--azad-accent-light); background: rgba(212,160,23,0.08); }
        .azad-nav-links a.active { color: var(--azad-accent-light); }
        .azad-nav-actions { display: flex; align-items: center; gap: 8px; }
        {% if not is_rtl %}.azad-nav-actions { margin-left: auto; }{% else %}.azad-nav-actions { margin-right: auto; }{% endif %}
        .btn-nav-ghost { padding: 8px 18px; border-radius: 12px; font-size: 0.82rem; font-weight: 600; color: var(--azad-text); border: 1px solid rgba(212,160,23,0.15); transition: all 0.2s; }
        .btn-nav-ghost:hover { border-color: var(--azad-accent); color: var(--azad-accent-light); background: rgba(212,160,23,0.06); }
        .btn-nav-cta { padding: 8px 20px; border-radius: 12px; font-size: 0.82rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, #25D366, #128C7E); transition: all 0.25s; box-shadow: 0 4px 14px rgba(37,211,102,0.2); }
        .btn-nav-cta:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,211,102,0.3); }
        .nav-lang-btn { padding: 6px 12px; border-radius: 10px; color: var(--azad-text-muted); font-size: 0.8rem; font-weight: 500; transition: all 0.2s; }
        .nav-lang-btn:hover { color: var(--azad-accent-light); background: rgba(212,160,23,0.06); }
        .nav-hamburger { display: none; background: none; border: none; color: var(--azad-text); font-size: 1.3rem; cursor: pointer; padding: 6px 10px; border-radius: 10px; }
        @media (max-width: 991px) { .azad-nav-links, .btn-nav-ghost, .btn-nav-cta, .nav-lang-btn { display: none; } .nav-hamburger { display: block; } }
        /* ── HERO ── */
        .pricing-hero { padding: 140px 24px 60px; text-align: center; position: relative; overflow: hidden; }
        .pricing-hero::before { content: ''; position: absolute; top: -40%; left: 50%; transform: translateX(-50%); width: 800px; height: 800px; background: radial-gradient(circle, rgba(212,160,23,0.06) 0%, transparent 70%); pointer-events: none; }
        .pricing-hero-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(212,160,23,0.08); border: 1px solid rgba(212,160,23,0.15); padding: 8px 20px; border-radius: 40px; font-size: 0.8rem; color: var(--azad-accent-light); margin-bottom: 24px; }
        .pricing-hero h1 { font-size: 2.8rem; font-weight: 900; background: linear-gradient(135deg, #fff 30%, var(--azad-accent-light) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 16px; }
        .pricing-hero p { font-size: 1.1rem; color: var(--azad-text-secondary); max-width: 600px; margin: 0 auto 32px; }
        /* ── TOGGLE ── */
        .billing-toggle { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 48px; }
        .billing-toggle span { font-size: 0.9rem; color: var(--azad-text-secondary); font-weight: 500; }
        .billing-toggle .toggle-track { width: 48px; height: 26px; background: rgba(212,160,23,0.15); border-radius: 40px; cursor: pointer; position: relative; transition: background 0.3s; border: 1px solid rgba(212,160,23,0.1); }
        .billing-toggle .toggle-track::after { content: ''; width: 20px; height: 20px; background: var(--azad-accent); border-radius: 50%; position: absolute; top: 2px; transition: all 0.3s; }
        {% if not is_rtl %}.billing-toggle .toggle-track::after { right: 3px; }{% else %}.billing-toggle .toggle-track::after { left: 3px; }{% endif %}
        .billing-toggle .toggle-track.active { background: rgba(212,160,23,0.25); }
        .billing-toggle .save-badge { background: linear-gradient(135deg, #10b981, #059669); color: #fff; padding: 2px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; }
        /* ── CARDS ── */
        .pricing-grid { max-width: 1100px; margin: 0 auto 60px; padding: 0 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; }
        .azad-tier-card { background: var(--azad-card); backdrop-filter: blur(20px); border: 1px solid var(--azad-border); border-radius: 24px; padding: 40px 32px; display: flex; flex-direction: column; position: relative; transition: all 0.35s ease; }
        .azad-tier-card:hover { transform: translateY(-6px); border-color: rgba(212,160,23,0.2); box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .azad-tier-card.featured { border-color: rgba(212,160,23,0.3); box-shadow: 0 0 40px rgba(212,160,23,0.06); }
        .azad-tier-card.featured::before { content: ''; position: absolute; inset: -1px; border-radius: 24px; padding: 1px; background: linear-gradient(135deg, rgba(212,160,23,0.3), transparent 40%, transparent 60%, rgba(212,160,23,0.15)); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
        .azad-tier-badge { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, var(--azad-accent), #b8941e); color: #fff; padding: 6px 20px; border-radius: 30px; font-size: 0.75rem; font-weight: 700; }
        .azad-tier-icon { font-size: 1.6rem; margin-bottom: 8px; }
        .azad-tier-name { font-size: 1.4rem; font-weight: 800; margin-bottom: 4px; }
        .azad-tier-desc { font-size: 0.82rem; color: var(--azad-text-secondary); margin-bottom: 20px; }
        .azad-tier-price { margin-bottom: 24px; }
        .azad-tier-price .price-amount { font-size: 2.8rem; font-weight: 900; color: var(--azad-accent-light); }
        .azad-tier-price .price-period { font-size: 0.9rem; color: var(--azad-text-secondary); }
        .azad-tier-price .price-note { font-size: 0.75rem; color: var(--azad-text-muted); margin-top: 4px; }
        .azad-tier-features { list-style: none; margin-bottom: 28px; flex-grow: 1; }
        .azad-tier-features li { padding: 10px 0; border-bottom: 1px solid rgba(212,160,23,0.04); display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--azad-text-secondary); }
        .azad-tier-features li i { width: 16px; text-align: center; }
        .azad-tier-features li .fa-check { color: #10b981; }
        .azad-tier-features li .fa-times { color: #ef4444; }
        .azad-tier-btn-wa { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 24px; border-radius: 16px; background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; font-size: 0.95rem; font-weight: 700; border: none; cursor: pointer; transition: all 0.25s; box-shadow: 0 4px 16px rgba(37,211,102,0.15); }
        .azad-tier-btn-wa:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(37,211,102,0.25); }
        .azad-tier-btn-outline { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 24px; border-radius: 16px; background: rgba(212,160,23,0.06); color: var(--azad-accent-light); font-size: 0.95rem; font-weight: 700; border: 1px solid rgba(212,160,23,0.12); cursor: pointer; transition: all 0.25s; text-decoration: none; margin-top: 10px; }
        .azad-tier-btn-outline:hover { background: rgba(212,160,23,0.1); border-color: rgba(212,160,23,0.2); }
        /* ── ADD-ONS ── */
        .addons-section { max-width: 1100px; margin: 0 auto 60px; padding: 0 24px; }
        .addons-section h2 { text-align: center; font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
        .addons-section > p { text-align: center; color: var(--azad-text-secondary); margin-bottom: 32px; }
        .addons-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .addon-item { background: var(--azad-card); backdrop-filter: blur(20px); border: 1px solid var(--azad-border); border-radius: 16px; padding: 20px; text-align: center; transition: all 0.25s; }
        .addon-item:hover { border-color: rgba(212,160,23,0.15); transform: translateY(-2px); }
        .addon-item i { font-size: 1.4rem; color: var(--azad-accent); margin-bottom: 8px; }
        .addon-item h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; }
        .addon-item .addon-price { font-size: 0.85rem; color: var(--azad-accent-light); font-weight: 700; }
        .addon-item .addon-desc { font-size: 0.75rem; color: var(--azad-text-muted); }
        /* ── CTA ── */
        .cta-section { text-align: center; padding: 60px 24px 40px; }
        .cta-section h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
        .cta-section p { color: var(--azad-text-secondary); margin-bottom: 28px; }
        .cta-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .azad-tier-btn-wa { padding: 14px 24px; border-radius: 16px; background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; font-size: 0.95rem; font-weight: 700; border: none; cursor: pointer; transition: all 0.25s; }
        .azad-tier-btn-wa:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(37,211,102,0.25); }
        .azad-tier-btn-outline { padding: 14px 24px; border-radius: 16px; background: rgba(212,160,23,0.06); color: var(--azad-accent-light); font-size: 0.95rem; font-weight: 700; border: 1px solid rgba(212,160,23,0.12); cursor: pointer; text-decoration: none; margin-top: 10px; }
        .azad-tier-btn-outline:hover { background: rgba(212,160,23,0.1); border-color: rgba(212,160,23,0.2); }
        /* ── FOOTER ── */
        .azad-footer { background: var(--azad-surface); border-top: 1px solid var(--azad-border); padding: 48px 24px 24px; margin-top: 40px; }
        .azad-footer-inner { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 32px; }
        .azad-footer-col h4 { font-size: 0.85rem; color: var(--azad-text); margin-bottom: 12px; font-weight: 700; }
        .azad-footer-links { list-style: none; }
        .azad-footer-links li { margin-bottom: 6px; }
        .azad-footer-links a { color: var(--azad-text-muted); font-size: 0.8rem; transition: color 0.2s; }
        .azad-footer-links a:hover { color: var(--azad-accent-light); }
        .azad-footer-bottom { text-align: center; padding-top: 24px; margin-top: 24px; border-top: 1px solid var(--azad-border); color: var(--azad-text-muted); font-size: 0.78rem; }
        .azad-footer-bottom .azad-footer-made-in { display: block; }
        .azad-footer-made-in .made-label { display: block; }
        .azad-footer-made-in .made-by { display: block; font-size: 0.85rem; color: var(--azad-text-muted); }
    </style>
    <script nonce="{{ csp_nonce() }}">
(function() {
    const nav = document.getElementById('azadNav');
    if (nav) {
        window.addEventListener('scroll', function() {
            if (window.scrollY > 60) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        });
    }
    const logo = document.getElementById('brandLogo');
    if (logo) {
        logo.addEventListener('error', function() { this.style.display = 'none'; });
    }
    const toggle = document.getElementById('billingToggle');
    const monthlySpan = document.getElementById('billingMonthly');
    const yearlySpan = document.getElementById('billingYearly');
    let isYearly = false;
    function updatePrices() {
        const amounts = document.querySelectorAll('.price-amount');
        const periods = document.querySelectorAll('.price-period-display');
        const notes = document.querySelectorAll('.price-yearly-note');
        const waBtns = document.querySelectorAll('.wa-subscribe');
        if (isYearly) {
            toggle.classList.add('active');
            monthlySpan.style.color = 'var(--azad-text-muted)';
            yearlySpan.style.color = 'var(--azad-accent-light)';
            const prices = [290, 790, 2490];
            amounts.forEach(function(el, idx) {
                if (idx < prices.length) el.textContent = '$' + prices[idx];
                if (periods[idx]) periods[idx].textContent = '{{ _('/year') }}';
                if (notes[idx]) notes[idx].style.display = 'block';
            });
            waBtns.forEach(function(btn) {
                const yearlyMsg = btn.getAttribute('data-wa-yearly');
                if (yearlyMsg) btn.href = 'https://wa.me/{{ developer_whatsapp_link or config.DEVELOPER_WHATSAPP }}?text=' + yearlyMsg;
            });
        } else {
            toggle.classList.remove('active');
            monthlySpan.style.color = 'var(--azad-accent-light)';
            yearlySpan.style.color = 'var(--azad-text-muted)';
            const prices = [29, 79, 249];
            amounts.forEach(function(el, idx) {
                if (idx < prices.length) el.textContent = '$' + prices[idx];
                if (periods[idx]) periods[idx].textContent = '{{ _('/month') }}';
                if (notes[idx]) notes[idx].style.display = 'none';
            });
            waBtns.forEach(function(btn) {
                const monthlyMsg = btn.getAttribute('data-wa-monthly');
                if (monthlyMsg) btn.href = 'https://wa.me/{{ developer_whatsapp_link or config.DEVELOPER_WHATSAPP }}?text=' + monthlyMsg;
            });
        }
    function updatePrices() {
        if (toggle.classList.contains('active')) {
            isYearly = true;
        } else {
            isYearly = false;
        }
        updatePrices();
    }
    if (toggle) {
        toggle.addEventListener('click', function() { isYearly = !isYearly; updatePrices(); });
        toggle.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); isYearly = !isYearly; updatePrices(); } });
    }
    const observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                entry.target.style.opacity = '1';
                entry.target.style.transform = 'translateY(0)';
            }
        }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
    });
    document.querySelectorAll('.azad-tier-card, .addon-item').forEach(function(el) {
        el.style.opacity = '0';
        el.style.transform = 'translateY(30px)';
        el.style.transition = 'all 0.6s ease-out';
        observer.observe(el);
    });
})();
</script>
</body>
</html>
