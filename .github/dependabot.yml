version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - "patch"
          - "minor"
    ignore:
      # Ruff is deliberately pinned to match CI lint gates; bump manually.
      - dependency-name: "ruff"
      # Flask-Caching 2.5.0 removed the 'null' cache backend used by
      # CACHE_TYPE="null" (config/tests/first-run). Bump manually only
      # together with a CACHE_TYPE migration.
      - dependency-name: "flask-caching"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      js-dev-deps:
        dependency-type: "development"
