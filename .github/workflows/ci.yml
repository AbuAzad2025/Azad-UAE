  # ── API fuzz testing (Schemathesis, non-blocking) ──
  api-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt schemathesis==4.24.3
      - name: Wait for PostgreSQL to be ready
        run: |
          # pg_isready only checks if the port is open, not if the database
          # is fully initialized and accepting authentication. Wait until we
          # can actually connect and run a simple query.
          sleep 30  # Give PostgreSQL time to finish initialization
          for i in $(seq 1 120); do
            if PGPASSWORD=azad_test psql -h localhost -U azad_test -d azad_test -c "SELECT 1" > /dev/null 2>&1; then
              echo "PostgreSQL is ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for PostgreSQL... (attempt $i/120)"
            sleep 2
          done
          echo "::error::PostgreSQL did not become ready in time"
          exit 1
      - name: Warm up database schema
        env:
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: test-secret-key
          OWNER_PASSWORD: TestOwner@1234567890123456!
          APP_ENV: testing
          DEBUG: "true"
          AUTO_MIGRATE: "1"
        run: |
          # Schema comes from Alembic, the same source the app uses. db.create_all()
            # built a competing definition of the tables from model metadata,
            # and it also had to run *after* create_app() - so the boot tried to
            # query tenants before any table existed and died first.
            flask db upgrade
      - name: Boot app and run Schemathesis (non-blocking)
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: test-secret-key
          OWNER_PASSWORD: TestOwner@1234567890123456!
          APP_ENV: testing
          ENABLE_SWAGGER_UI: "true"
          DEBUG: "true"
          AUTO_MIGRATE: "1"
        run: |
          # Start app in background
          python -m flask run --port=5000 --host=0.0.0.0 &
          # Wait for app to be ready (max 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api-docs/openapi.json > /dev/null 2>&1; then
              echo "App ready after ${i}s"
              break
            fi
            sleep 1
          done
          # Fuzz public + documented API endpoints — spec served at /api-docs/openapi.json
          # Schemathesis v4: base-url + request-timeout live in scripts/schemathesis.toml (CLI flags removed).
          # ignored_auth: no session-auth context is configured for the fuzzer (covered by tenant-isolation
          # tests); negative_data_rejection: intentionally tolerant read endpoints 200 on junk input.
          # --config-file is a top-level CLI option and must precede the `run` subcommand.
          #
          # Stays non-blocking (a fuzz finding must not fail the build on its own),
          # but the finding is no longer swallowed: the old `|| echo` discarded
          # Schemathesis's own output, so the annotation said only "issues (ignored)"
          # and the actual failing check was invisible without reading raw logs.
          set +e
          schemathesis --config-file scripts/schemathesis.toml run http://localhost:5000/api-docs/openapi.json \
            --max-failures 1 \
            --exclude-checks ignored_auth,negative_data_rejection 2>&1 | tee schemathesis.log
          fuzz_rc=${PIPESTATUS[0]}
          set -e
          if [ "$fuzz_rc" -ne 0 ]; then
            echo "::warning title=api-fuzz::Schemathesis exited ${fuzz_rc} — failing checks (see schemathesis-log artifact):"
            grep -iE "failed|error|missing_property|not defined" schemathesis.log | head -15 || true
          fi

      - name: Upload api-fuzz log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: schemathesis-log
          path: schemathesis.log
          if-no-files-found: ignore
          retention-days: 14

