        run: pytest tests/unit/test_js_reachability.py -v --tb=short

  # ── Git & repository scanning ──
  repo-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
      # `if: always()` is load-bearing. exit-code: '1' above fails the step, which
      # aborts the job, so with the default `if: success()` this upload never ran
      # and the scan destroyed its own findings. Run 36824832100 failed repo-security
      # with no retrievable SARIF for exactly that reason - a security gate that
      # cannot tell you what it found.
      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs'

