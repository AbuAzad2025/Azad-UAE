  # ── Lighthouse CI (web vitals, BLOCKING) ──
  # This gate measured nothing until now. Nothing in this job ran the migrations,
  # so the azad_test database had no tables; every context processor query raised
  # UndefinedTable and both audited URLs rendered error pages. `continue-on-error:
  # true` then discarded lhci's non-zero exit, so the job went green while
  # auditing a broken page. Separately, every assertion in lighthouserc.json was
  # "warn", so even without that, no score could ever fail the build.
  #
  # Now: schema is provisioned first, the server is started explicitly so a boot
  # failure surfaces its own log, both audited URLs are confirmed to return 200
  # before lhci runs, and the assertions are "error".
  #
  # On the SEO floor: /auth/login is deliberately `noindex, nofollow`, which is
  # correct for a login page and makes Lighthouse's is-crawlable audit fail. Its
  # measured SEO was 0.66 against a 0.90 floor, so a 0.90 gate here punishes the
  # app for being right about not indexing credentials. The floor is 0.70 and is
  # PROVISIONAL - set from one measurement, not a principle. The principled fix is
  # to apply the SEO budget only to / (which should be indexable) using an
  # assert matrix, and that needs the measured baseline first. Ratchet it from
  # real numbers, not from optimism.
  #
  # On the score swinging between 65 and 97 for the same commit and the same
  # URL: one sample was measuring the RUNNER, not the page. Two measured causes,
  # both fixed below without moving a floor:
  #
  #   * a cold server. gunicorn boots one worker per core (2*CPU+1) and every
  #     worker runs the whole create_app() path - the seeding and the
  #     seed-manifest probes - 9.6s per worker, measured, all of them at once
  #     against the same Postgres. The first request a worker serves then pays
  #     the lazy imports, the Jinja compile of public/landing.html and the first
  #     DB connection: 454ms against 28ms for the same page warm.
  #   * a cold audit. lhci ran ONE Lighthouse run per URL, so a single cold
  #     sample decided the whole gate.
  #
  # The gate now measures the median of 3 runs per URL (the median run, and the
  # median of each category, have to clear the floor) and the server is warmed
  # before the audit starts. A page that is genuinely slow is slow in its
  # median too, so the floors still bite.
  lighthouse-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
      SECRET_KEY: test-secret-key
      OWNER_PASSWORD: TestOwner@1234567890123456!
      APP_ENV: testing
      CI: "true"
      AUTO_MIGRATE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt gunicorn
          npm install -g @lhci/cli
      - name: Wait for PostgreSQL to be ready
        run: |
          # pg_isready only checks if the port is open, not if the database
          # is fully initialized and accepting authentication. Wait until we
          # can actually connect and run a simple query.
          sleep 30  # Give PostgreSQL time to finish initialization
          for i in $(seq 1 120); do
            if PGPASSWORD=azad_test psql -h localhost -U azad_test -d azad_test -c "SELECT 1" > /dev/null 2>&1; then
              echo "PostgreSQL is ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for PostgreSQL... (attempt $i/120)"
            sleep 2
          done
          echo "::error::PostgreSQL did not become ready in time"
          exit 1
      - name: Provision schema
        run: |
          # Deliberately NOT `|| true`. An unmigrated database is exactly the
          # failure this gate was silently reporting as a pass.
          flask db upgrade
          python scripts/lint/check_model_schema_parity.py
      - name: Start app server
        run: |
          # One worker, several threads, on purpose.
          #
          # gunicorn's default is 2*CPU+1 workers, and every one of them runs
          # the whole create_app() path at boot: the seeding, the
          # seed-manifest probes and the tenant maintenance (9.6s measured on a
          # developer box). With the default worker count that is a herd of
          # seeders against one Postgres, still running while the audit starts.
          # It is also a lottery: a curl warms the worker that answered it, and
          # the audited request lands on whichever worker is free - a worker
          # that has never rendered the page pays the lazy imports, the Jinja
          # compile and the first DB connection inside the measured window
          # (454ms against 28ms warm, measured on the same process).
          #
          # One worker removes the lottery and the herd. Threads keep the
          # browser's parallel asset fetches parallel, so the page is not
          # penalised for the single process. This job measures a page, not a
          # throughput - tests/integration/test_sales_concurrency_load.py is
          # where concurrency is measured.
          gunicorn --bind 0.0.0.0:5000 --worker-class gthread --workers 1 --threads 4 \
            --timeout 60 --access-logfile gunicorn-access.log \
            wsgi:app --daemon --error-logfile gunicorn.log

          # Readiness is a GATE, not a suggestion.
          #
          # The old loop ran 90 attempts and then fell out of the bottom of the
          # `for` whatever the server had answered, and the step exited 0
          # either way. A server that never came up was reported as a server
          # that did, and the failure surfaced three steps later as "nothing
          # was measured" - a message that named neither the server nor the
          # step that had lost it. The loop now has to END in a 200, and a
          # dead gunicorn ends it immediately instead of after 90 silent
          # attempts.
          ready=0
          code=000
          for attempt in $(seq 1 90); do
            # A redirect is not readiness: no -L here, so a 302 keeps the loop
            # waiting instead of being read as "the server is up".
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
              http://localhost:5000/auth/login || true)
            code=${code:-000}
            if [ "$code" = "200" ]; then
              ready=1
              echo "::notice::gunicorn answered 200 on /auth/login after $attempt attempt(s)"
              break
            fi
            if ! pgrep -f gunicorn > /dev/null 2>&1; then
              echo "::error::gunicorn is no longer running - it died during boot (attempt $attempt, last status $code)"
              break
            fi
            if [ $((attempt % 10)) -eq 0 ]; then
              echo "::notice::still waiting for the server (attempt $attempt/90, last status $code)"
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::The app server never answered 200 on /auth/login (last status: $code)."
            echo "::error::The audit below cannot run against a server that is not up - read gunicorn.log for the boot traceback."
            echo "--- gunicorn.log ---"
            cat gunicorn.log 2>/dev/null || echo "(no gunicorn.log - the server never wrote one)"
            exit 1
          fi
      - name: Warm up and verify the audited pages
        run: |
          # The audit must measure a WARM page, so the server is warmed the way
          # a visitor's browser would warm it: every audited URL is fetched
          # until it answers 200, together with the static assets the page
          # references. The cold and the warm timings are printed, so the log
          # shows what the warm-up bought, and gunicorn-access.log carries the
          # server-side duration of every request - including the audited ones.
          #
          # The 200 is the point, not a formality: lhci will happily audit an
          # error page and report a score for it. Redirects are followed and
          # the settled response has to be 200, and a redirect chain is
          # refused: a loop or a redirect into a login prompt means the page
          # under test is not the page we think it is. These are the canonical
          # paths - /login is a legacy alias registered in main.py that 302s to
          # /auth/login, so auditing it measured a redirect rather than the
          # login form.
          #
          # What is NOT warmed: a third-party font stylesheet. There is none
          # left - every family is served from this repository (static/fonts/)
          # - so the page no longer has a dependency the runner does not
          # control. See docs/LIGHTHOUSE_GATE.md for the measurement.
          set -uo pipefail
          audited_urls=("http://localhost:5000/auth/login" "http://localhost:5000/")
          warmup_rounds=3
          assets_file="${RUNNER_TEMP:-/tmp}/lh_assets.txt"
          echo "Warming ${#audited_urls[@]} URL(s), $warmup_rounds round(s) each."

          for url in "${audited_urls[@]}"; do
            for round in $(seq 1 "$warmup_rounds"); do
              # Every number comes out of a command substitution, and every
              # variable starts at a defined value.
              #
              # The old line was
              #   read -r code hops secs < <(curl ... -w '%{http_code} ...')
              # and it killed the step SILENTLY on the first SUCCESSFUL
              # request: curl's -w output has no trailing newline, so `read`
              # reaches EOF and returns 1, and the runner's `bash -e` turns
              # that into an exit before a single line was printed. Run
              # 39674996405 died exactly there - 38ms, no output, exit 1 - and
              # the job's only message was "nothing was measured" three steps
              # downstream, naming neither the cause nor the step.
              code=000
              hops=0
              secs=0
              raw=$(curl -sSL -o /dev/null --max-time 30 \
                -w '%{http_code} %{num_redirects} %{time_total}\n' "$url" 2>/dev/null) || raw=""
              if [ -n "$raw" ]; then
                # A here-string always ends with a newline, so `read` returns 0.
                IFS=' ' read -r code hops secs <<< "$raw" || true
              fi
              case "$code" in ''|*[!0-9]*) code=000 ;; esac
              case "$hops" in ''|*[!0-9]*) hops=0 ;; esac
              case "$secs" in ''|*[!0-9.]*) secs=0 ;; esac
              if [ "$code" != "200" ]; then
                echo "::error::$url settled on $code, not 200 (round $round of $warmup_rounds)"
                echo "--- gunicorn.log ---"
                cat gunicorn.log 2>/dev/null || echo "(no gunicorn.log)"
                exit 1
              fi
              if [ "$hops" -gt 2 ]; then
                echo "::error::$url took $hops redirects - redirect chain, not a real page"
                exit 1
              fi
              echo "  $url warm#$round -> $code (${hops} redirect(s), ${secs}s)"
            done

            # The assets this page references, so the first audited run does
            # not pay for a cold asset path either.
            curl -sSL "$url" \
              | grep -oE '(href|src)="/static/[^"]+"' \
              | sed -E 's/^[^"]*"([^"]+)"$/\1/' \
              | sort -u > "$assets_file" || true
            while read -r asset || [ -n "$asset" ]; do
              [ -n "$asset" ] || continue
              asset_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                "http://localhost:5000$asset" || true)
              asset_code=${asset_code:-000}
              echo "  asset $asset -> $asset_code"
              if [ "$asset_code" != "200" ]; then
                # A page that links an asset the server does not have is a
                # broken page, and lhci would score it without complaining.
                echo "::error::$asset answered $asset_code - the page links an asset the server does not serve"
                echo "--- gunicorn.log ---"
                cat gunicorn.log 2>/dev/null || echo "(no gunicorn.log)"
                exit 1
              fi
            done < "$assets_file"
          done
          echo "Warm-up complete: ${#audited_urls[@]} URL(s) x $warmup_rounds round(s), all settled on 200."
      - name: Run Lighthouse CI
        run: |
          # collect/assert/upload are separate on purpose: `autorun` swallows a
          # non-zero collect when the server never came up, which is the same
          # silence as before. Explicit steps stop at the first failure.
          #
          # collect runs 3 Lighthouse runs per URL (numberOfRuns in
          # scripts/lighthouserc.json). One run cannot tell a regression from a
          # cold server; three can, and the gate reads the median of them.
          lhci collect --config=scripts/lighthouserc.json
          # Persist before asserting. With upload after assert, a failing gate
          # skipped it, so `.lighthouseci/` was empty, the artifact was empty,
          # and the reports that explain the failure were the one thing thrown
          # away. Evidence first, verdict second.
          lhci upload --config=scripts/lighthouserc.json
      - name: Report measured scores
        if: always()
        run: python scripts/lint/report_lighthouse_scores.py
      - name: Assert Lighthouse budgets
        # Run from .lighthouse-gate: the report step wrote the MEDIAN run of
        # each URL there, and `lhci assert` reads the lhr-*.json files of the
        # .lighthouseci directory of the working directory it runs from. Pointed
        # at the raw .lighthouseci/ it would assert every individual run, and
        # one cold run would fail the build - the exact artefact this job
        # exists to stop measuring. The raw runs stay in .lighthouseci/ as the
        # evidence, and the numbers asserted here are the ones the report
        # printed.
        working-directory: .lighthouse-gate
        run: lhci assert --config=../scripts/lighthouserc.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci
            .lighthouse-gate
            gunicorn-access.log
          # upload-artifact@v4 skips dotfiles unless told otherwise, and
          # .lighthouseci is a dotfile. Without this the step warns "No files were
          # found with the provided path" and the run carries no evidence at all,
          # while still reporting success.
          include-hidden-files: true

  # ── E2E business flow tours (Playwright, BLOCKING) ──
  # Tours are BLOCKING: any failure fails the CI job (no continue-on-error).
  # Gate: npx playwright test --config=scripts/playwright.config.json --reporter=list
  # (JS tours; the old pytest-playwright POS tours never actually ran in CI —
  # their conftest STATE_DIR was off-by-one so every tour silently skipped —
  # and their assumptions did not match the real POS UI. They were removed.)
  e2e-tours:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt gunicorn playwright
          python -m playwright install --with-deps chromium
      - name: Install Node deps (for JS tours)
        run: |
          npm ci --no-audit --no-fund
          # The tours run via `npx playwright` (Node 1.62.x), whose expected
          # browser build differs from the one installed by pip's playwright.
          # Install the Node-side chromium as well (deps already installed above).
          npx playwright install chromium
      - name: Wait for PostgreSQL to be ready
        run: |
          # pg_isready only checks if the port is open, not if the database
          # is fully initialized and accepting authentication. Wait until we
          # can actually connect and run a simple query.
          sleep 30  # Give PostgreSQL time to finish initialization
          for i in $(seq 1 120); do
            if PGPASSWORD=azad_test psql -h localhost -U azad_test -d azad_test -c "SELECT 1" > /dev/null 2>&1; then
              echo "PostgreSQL is ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for PostgreSQL... (attempt $i/120)"
            sleep 2
          done
          echo "::error::PostgreSQL did not become ready in time"
          exit 1
      - name: Seed auth users and export states
        env:
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: test-secret-key
          OWNER_PASSWORD: TestOwner@1234567890123456!
          APP_ENV: testing
          AUTO_MIGRATE: "1"
        run: |
          python scripts/auth/setup_test_users.py
      - name: Start app server for tours
        env:
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: test-secret-key
          OWNER_PASSWORD: TestOwner@1234567890123456!
          APP_ENV: testing
          AUTO_MIGRATE: "1"
        run: |
          gunicorn --bind 0.0.0.0:5000 wsgi:app --daemon --error-logfile gunicorn.log
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:5000/auth/login >/dev/null 2>&1; then
              echo "App server is up (attempt $attempt)"
              exit 0
            fi
            sleep 3
          done
          echo "App server failed to start"; cat gunicorn.log; exit 1
      - name: Run Playwright JS tours (BLOCKING, --reporter=list)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5000
        run: |
          npx playwright test --config=scripts/playwright.config.json --reporter=list
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ── Comprehensive coverage report (backend + frontend) ──
  coverage-report:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install coverage
        run: pip install coverage

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: covdata-*
          path: coverage-data/

      - name: Download template coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: templates-*
          path: template-data/

      - name: Download frontend coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-frontend
          path: coverage-frontend/

      - name: Combine coverage data
        run: |
          shopt -s nullglob
          files=(coverage-data/covdata-*/coverage-data-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No coverage data artifacts found — test jobs may have failed early"
            exit 0
          fi
          coverage combine "${files[@]}"
          cp .coverage coverage-combined-data

      - name: Enforce coverage floor (COVERAGE_FAIL_UNDER=${{ env.COVERAGE_FAIL_UNDER }})
        if: hashFiles('.coverage') != ''
        run: coverage report --show-missing --fail-under=${{ env.COVERAGE_FAIL_UNDER }}

      # Each layer gets its own floor. The global floor is blind to a layer
      # eroding: routes are 28% of the statements, so a route layer falling
      # from 99% to 90% would still leave the whole project above 95%. The
      # floors below sit just under the measured values, so ordinary churn
      # does not break them and a regression cannot hide behind the total.
      - name: Enforce the per-layer floors
        if: hashFiles('.coverage') != ''
        run: |
          while read -r pattern floor; do
            [ -z "$pattern" ] && continue
            echo "::group::$pattern >= $floor%"
            if ! out=$(coverage report --include="$pattern" --fail-under="$floor" 2>&1); then
              echo "$out" | tail -20
              echo "::endgroup::"
              exit 1
            fi
            echo "$out" | tail -1
            echo "::endgroup::"
          done <<'FLOORS'
          routes/* 98
          services/* 97
          models/* 99
          utils/* 96
          app/* 90
          FLOORS

      - name: Generate comprehensive coverage report
        if: hashFiles('.coverage') != ''
        run: python scripts/coverage_report.py

      - name: Upload combined coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-combined
          path: coverage-combined-data
          if-no-files-found: ignore
          retention-days: 7
