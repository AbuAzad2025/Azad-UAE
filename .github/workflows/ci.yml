    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
    - name: Install coverage
      run: pip install coverage
    - name: Download coverage artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: covdata-*
        path: coverage-data/
    - name: Download template coverage artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: templates-*
        path: template-data/
    - name: Download frontend coverage artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: coverage-frontend
        path: coverage-frontend/
    - name: Combine coverage data
      run: "shopt -s nullglob\nfiles=(coverage-data/covdata-*/coverage-data-*)\nif [ ${#files[@]} -eq 0 ]; then\n  echo \"::warning::No coverage data artifacts found \xE2\u20AC\u201D test jobs may have failed early\"\n  exit 0\nfi\ncoverage combine \"${files[@]}\"\ncp .coverage coverage-combined-data\n"
    - name: Enforce coverage floor (COVERAGE_FAIL_UNDER=${{ env.COVERAGE_FAIL_UNDER }})
      if: hashFiles('.coverage') != ''
      run: coverage report --show-missing --fail-under=${{ env.COVERAGE_FAIL_UNDER }}
    - name: Enforce the per-layer floors
      if: hashFiles('.coverage') != ''
      run: "while read -r pattern floor; do\n  [ -z \"$pattern\" ] && continue\n  echo \"::group::$pattern >= $floor%\"\n  if ! out=$(coverage report --include=\"$pattern\" --fail-under=\"$floor\" 2>&1); then\n    echo \"$out\" | tail -20\n    echo \"::endgroup::\"\n    exit 1\n  fi\n  echo \"$out\" | tail -1\n  echo \"::endgroup::\"\ndone <<'FLOORS'\nroutes/* 98\nservices/* 97\nmodels/* 99\nutils/* 96\napp/* 90\nFLOORS\n"
    - name: Generate comprehensive coverage report
      if: hashFiles('.coverage') != ''
      run: python scripts/coverage_report.py
    - name: Upload combined coverage data
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-combined
        path: coverage-combined-data
        if-no-files-found: ignore
        retention-days: 7
