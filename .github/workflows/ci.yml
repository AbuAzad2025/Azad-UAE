# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Coverage policy: every production file type is gated — Python, Jinja/HTML,
# JavaScript, CSS, YAML and JSON. Only documentation, binary assets and
# vendored third-party bundles (AdminLTE) may skip a CI run.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.svg'
      - '**.png'
      - '**.jpg'
      - '**.ico'
      - '**.woff'
      - '**.woff2'
      - '**.ttf'
      - 'static/adminlte/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.svg'
      - '**.png'
      - '**.jpg'
      - '**.ico'
      - '**.woff'
      - '**.woff2'
      - '**.ttf'
      - 'static/adminlte/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  # Minimum total line coverage enforced in coverage-report.
  # Set to 85 to enforce a meaningful floor; current coverage is ~96%.
  COVERAGE_FAIL_UNDER: '85'
  # `flask db upgrade` needs an app factory. Also stops the Flask CLI from
  # auto-loading ./app.py, which builds a second app instance on import.
  FLASK_APP: 'app.factory:create_app'

jobs:
  # ── Matrix engine: adapt PG version grid to Git ref ──
  determine-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          IS_MAIN_OR_TAG='${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}'
          if [ "$IS_MAIN_OR_TAG" = "true" ]; then
            MATRIX='{"include":[
              {"postgres-version":15,"test-group":"routes",  "test-path":"tests/unit/routes/",             "cov-flag":"unit-routes-pg15"},
              {"postgres-version":16,"test-group":"routes",  "test-path":"tests/unit/routes/",             "cov-flag":"unit-routes-pg16"},
              {"postgres-version":17,"test-group":"routes",  "test-path":"tests/unit/routes/",             "cov-flag":"unit-routes-pg17"},
              {"postgres-version":15,"test-group":"services","test-path":"tests/unit/services/",           "cov-flag":"unit-services"},
              {"postgres-version":15,"test-group":"models",  "test-path":"tests/unit/models/",             "cov-flag":"unit-models"},
              {"postgres-version":15,"test-group":"ai_knowledge","test-path":"tests/unit/ai_knowledge/",  "cov-flag":"unit-ai-knowledge"},
              {"postgres-version":15,"test-group":"utils",   "test-path":"tests/unit/utils/ tests/unit/app/ tests/unit/runtime_core/", "cov-flag":"unit-utils"},
              {"postgres-version":15,"test-group":"core",    "test-path":"tests/unit/ --ignore=tests/unit/routes --ignore=tests/unit/services --ignore=tests/unit/ai_knowledge --ignore=tests/unit/models --ignore=tests/unit/utils --ignore=tests/unit/app --ignore=tests/unit/runtime_core", "cov-flag":"unit-core"},
              {"postgres-version":15,"test-group":"integration","test-path":"tests/integration/",          "cov-flag":"integration"},
              {"postgres-version":15,"test-group":"e2e",     "test-path":"tests/e2e/ --ignore=tests/e2e/tours/","cov-flag":"e2e"}
            ]}'
          else
            MATRIX='{"include":[
              {"postgres-version":16,"test-group":"routes",  "test-path":"tests/unit/routes/",             "cov-flag":"unit-routes"},
              {"postgres-version":16,"test-group":"services","test-path":"tests/unit/services/",           "cov-flag":"unit-services"},
              {"postgres-version":16,"test-group":"models",  "test-path":"tests/unit/models/",             "cov-flag":"unit-models"},
              {"postgres-version":16,"test-group":"ai_knowledge","test-path":"tests/unit/ai_knowledge/",  "cov-flag":"unit-ai-knowledge"},
              {"postgres-version":16,"test-group":"utils",   "test-path":"tests/unit/utils/ tests/unit/app/ tests/unit/runtime_core/", "cov-flag":"unit-utils"},
              {"postgres-version":16,"test-group":"core",    "test-path":"tests/unit/ --ignore=tests/unit/routes --ignore=tests/unit/services --ignore=tests/unit/ai_knowledge --ignore=tests/unit/models --ignore=tests/unit/utils --ignore=tests/unit/app --ignore=tests/unit/runtime_core", "cov-flag":"unit-core"},
              {"postgres-version":16,"test-group":"integration","test-path":"tests/integration/",          "cov-flag":"integration"},
              {"postgres-version":16,"test-group":"e2e",     "test-path":"tests/e2e/ --ignore=tests/e2e/tours/","cov-flag":"e2e"}
            ]}'
          fi
          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"

  # ── Python tests split by directory ──
  test:
    needs: [determine-matrix]
    name: ${{ matrix.test-group }} (PG ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Never cancel sibling groups: every directory must report, even when
      # another group fails �?" no part of the test suite may be skipped.
      fail-fast: false
      matrix: ${{ fromJSON(needs.determine-matrix.outputs.matrix) }}

    # Job-level so EVERY step that boots the app or runs pytest inherits it.
    # These were step-level on "Run tests" only, so the query-profiler step
    # below ran with no DATABASE_URL at all: conftest then fell back to the dev
    # database (postgres:123@localhost/azad_uae), every one of its 4706 tests
    # errored on connection refused, and `|| true` hid it. The profiler step
    # reported success while producing no profile.
    env:
      DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
      SECRET_KEY: test-secret-key-not-for-production
      OWNER_PASSWORD: TestOwner@1234567890123456!
      APP_ENV: testing
      DEBUG: "true"
      PYTEST_ADDOPTS: ""

    services:

      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # WeasyPrint warns that HarfBuzz-Subset "will be required by future
      # versions". Installing it now keeps the PDF/print tests off a
      # deprecation that will otherwise become a hard failure on a WeasyPrint
      # major bump. Not fatal if the package is unavailable on the runner image:
      # it is forward-compatibility, not a current requirement.
      - name: Install system libs for WeasyPrint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libharfbuzz-subset0 \
            || echo "::notice::libharfbuzz-subset0 not available on this runner; WeasyPrint will require it at a future major version"

      - name: Run tests
        run: |
          # Provision the schema from Alembic, the same source the app uses.
          # db.create_all() built a competing definition of the tables straight
          # from model metadata, so a column could exist in the model, be absent
          # from every migration, and still pass here while breaking any
          # environment that actually ran the migrations.
          #
          # This is deliberately NOT `|| true`. With the failure swallowed, a
          # broken migration chain just meant the tests ran against no schema
          # and failed later with a confusing UndefinedTable instead of here.
          flask db upgrade
          # Now that the schema is real, prove the models agree with it.
          python scripts/lint/check_model_schema_parity.py
          # Run the assigned test group
          pytest ${{ matrix.test-path }} -v --tb=short \
            --cov=. --cov-config=.coveragerc --cov-report=term \
            --cov-report=xml:coverage-${{ matrix.cov-flag }}.xml

          coverage combine 2>/dev/null || true
          ls -la .coverage 2>/dev/null || true
          cp .coverage coverage-data-${{ matrix.cov-flag }} 2>/dev/null || true

      # ── N+1 profiling (opt-in, rides the existing test runs) ──────────────
      # The profiler is loaded only for the two groups that exercise real request
      # lifecycles, and only on one PostgreSQL version, so it runs on a small slice
      # of the matrix. It is a second full pytest invocation for that slice, not a
      # free ride on the normal run. QUERY_PROFILE_OUT points at a directory that
      # is created here; the plugin writes the JSON in pytest's cleanup hook, which
      # runs even when a test fails, so a red run still yields the profile.
      - name: Profile SELECT queries per route
        if: ${{ matrix.test-group == 'integration' || (matrix.test-group == 'routes' && matrix.postgres-version == 16) }}
        env:
          QUERY_PROFILE: "1"
          QUERY_PROFILE_OUT: ${{ github.workspace }}/query-profile
          QUERY_PROFILE_TOP: "25"
          PYTHONPATH: ${{ github.workspace }}/tests
        run: |
          mkdir -p query-profile
          # Profiling must never block the suite, so the run itself is tolerated.
          pytest ${{ matrix.test-path }} -p query_profile_plugin -q --tb=short --no-cov || true
          # But a *missing* profile is a real defect, not a non-event: it means the
          # instrumentation is not working, which is exactly how this step stayed
          # broken and invisible. Fail loudly instead of printing a warning.
          if [ ! -f query-profile/query_profile.json ]; then
            echo "::error::query profiler produced no query_profile.json for ${{ matrix.test-group }} - N+1 instrumentation is not working"
            exit 1
          fi
          echo "profile written for ${{ matrix.test-group }}"

      - name: Upload query profile
        if: ${{ always() && (matrix.test-group == 'integration' || (matrix.test-group == 'routes' && matrix.postgres-version == 16)) }}
        uses: actions/upload-artifact@v7
        with:
          name: query-profile-${{ matrix.cov-flag }}
          path: query-profile/query_profile.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage to Codecov (optional)
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage-${{ matrix.cov-flag }}.xml
          flags: ${{ matrix.cov-flag }}
          fail_ci_if_error: false

      - name: Upload raw coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: covdata-${{ matrix.cov-flag }}
          path: coverage-data-${{ matrix.cov-flag }}
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload template coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: templates-${{ matrix.cov-flag }}
          path: templates_rendered.json
          if-no-files-found: ignore
          retention-days: 1

  # ── App boot verification (quick smoke test) ──
  verify-boot:
    needs: [determine-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify app boots
        env:
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: test-secret-key
          OWNER_PASSWORD: TestOwner@1234567890123456!
          APP_ENV: testing
        run: |
          python -c "from app import create_app; app = create_app()"

  # ── Security scan (bandit) ──
  # Scope comes ONLY from .bandit.yml — no inline excludes, so no production
  # Python file can silently drop out of the scan.
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit
      - name: Bandit security scan (gate)
        run: bandit -c .bandit.yml -r .
      - name: Bandit JSON report
        if: always()
        run: bandit -c .bandit.yml -r . -f json -o bandit-report.json || true
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 7

  # ── Static quality gates: Python · Jinja/HTML · JS · CSS · YAML · JSON ──
  lint-audit:
    name: Static quality (py · jinja · js · css · yaml · json)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Python lint tools
        run: |
          python -m pip install --upgrade pip
          # Full requirements are REQUIRED here: mypy needs real flask types
          # (e.g. abort() -> NoReturn) for correct narrowing — a slim install
          # degrades every unresolved import to Any and produces false errors.
          # ruff is PINNED: 0.16 expanded the default rule set (BLE001/UP017/
          # I001/FURB157...) which fires codebase-wide. Pin to the 0.15 line
          # whose defaults match this codebase's compliance baseline, same as
          # the pinned @biomejs/biome below.
          pip install -r requirements.txt ruff==0.15.22 mypy pip-audit yamllint jinja2

      - name: Install Node lint tools
        run: |
          npm ci --no-audit --no-fund
          npm install -g @biomejs/biome@2.5.4 cspell

      # ── Python ──
      - name: Ruff check (Python lint)
        run: ruff check . --output-format github

      - name: Ruff format (Python formatting)
        run: ruff format . --check --diff

      - name: Mypy (Python types)
        run: mypy . --ignore-missing-imports --no-error-summary --explicit-package-bases

      # ── Jinja / HTML templates ──
      - name: Jinja template gate (all templates must parse)
        run: python scripts/lint/check_templates.py

      - name: Strict i18n lint (templates & Python)
        run: python scripts/check_strict_i18n.py templates routes services --exclude-dirs services

      # i18n regression gates. check_strict_i18n proves every string is *wrapped*
      # in a translation call; these two prove the call actually resolves.
      # The gap they close: {{ _('x') }} and {% trans %} resolve through
      # environment.gettext, and with no translator installed there they returned
      # the raw key. 2022 call sites across 82 templates rendered English to an
      # Arabic user while passing the strict lint, because the key existed in the
      # catalogue - the call simply never consulted it.
      - name: Untranslated-key gate (no template call renders as its own key)
        run: python scripts/lint/check_i18n_untranslated.py --limit 20

      - name: Translation catalogue health (every key resolves to Arabic)
        run: python scripts/lint/report_catalogue_health.py --limit 20

      - name: Alembic graph gate (single head, reversible chain)
        run: python scripts/lint/check_migration_head.py

      - name: Transaction-boundary gate (services never end a transaction)
        run: python scripts/lint/check_txn_boundaries.py

      - name: Service side-effect gate (no schema/connection management in services)
        run: python scripts/lint/check_service_side_effects.py

      - name: Tag shape gate (no <pclass= / <tdclass= mangling)
        run: python scripts/lint/check_tag_shape.py

      - name: Accessibility gate (every form control has an accessible name)
        run: python scripts/lint/check_a11y_labels.py

      # Ratcheting budget, not a target. The template cleanup (inline styles ->
      # stylesheets, inline script -> /static/js) is being done in stages, so this
      # records where it currently stands and fails only on a regression. Lower
      # the numbers as stages land; they are not meant to reach zero here.
      #
      #   static  224 - was 281; print/receipt family converted to
      #              static/css/print-utilities.css. Next: public/landing (40),
      #              dashboard animation-delay (18), ledger width utilities.
      #   dynamic  21 - computed per row (stage colour, progress %, loop delay).
      #              A CHECK-style "no inline styles" rule is unachievable for
      #              these; the end state is a custom property read from a data-
      #              attribute, which still needs one style attribute.
      #   scripts 170 - inline <script> blocks, counted not yet bounded.
      #
      # Drop --max-dynamic and --max-inline-scripts once those stages are done.
      - name: Inline asset budget (static styles / inline scripts)
        run: |
          python scripts/lint/check_inline_assets.py --top 12
          python scripts/lint/check_inline_assets.py \
            --max-static 94 \
            --max-dynamic 21 \
            --max-inline-scripts 170

      # ── JavaScript ──
      - name: Biome check (JS lint+format, scope from biome.json)
        run: biome check . --reporter github

      - name: Frontend unit tests (vitest with coverage)
        run: npm test -- --coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: coverage-frontend/
          if-no-files-found: ignore
          retention-days: 7

      # ── CSS ──
      - name: Stylelint (all project CSS)
        run: npx stylelint "static/**/*.css"

      # ── JSON ──
      - name: JSON validation (every tracked .json file)
        run: |
          fail=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if ! python -m json.tool "$f" > /dev/null 2>&1; then
              echo "::error file=$f::Invalid JSON"
              fail=1
            fi
          done < <(git ls-files '*.json' -- ':!:node_modules')
          echo "Validated ${count} JSON file(s)"
          exit $fail

      # ── YAML ──
      - name: yamllint (every tracked .yml/.yaml file)
        run: |
          git ls-files '*.yml' '*.yaml' -- ':!:node_modules' | \
            xargs python -m yamllint -c .yamllint.yml

      # ── Dependencies & spelling ──
      - name: pip-audit (known vulnerabilities in requirements)
        run: python -m pip_audit -r requirements.txt

      - name: Cspell (templates & project JS)
        run: |
          npx cspell --config scripts/lint/.cspell.json \
            "templates/**/*.html" "static/js/**/*.js" "static/*.js"

      # ── GitHub Actions workflows themselves ──
      - name: actionlint (workflow syntax — fails on findings)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            docker.io/rhysd/actionlint:latest .github/workflows/*.yml

  # ── Frontend asset audit (Jinja/static) — Adaptive Frontend Asset Audit directive ──
  frontend-asset-quality:
    name: Frontend asset audit (Jinja/static)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run frontend asset audit (pytest)
        env:
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: test-secret-key-not-for-production
          OWNER_PASSWORD: TestOwner@1234567890123456!
          APP_ENV: testing
          DEBUG: "true"
        run: pytest tests/unit/test_js_reachability.py -v --tb=short

  # ── Git & repository scanning ──
  repo-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
      # `if: always()` is load-bearing. exit-code: '1' above fails the step, which
      # aborts the job, so with the default `if: success()` this upload never ran
      # and the scan destroyed its own findings. Run 36824832100 failed repo-security
      # with no retrievable SARIF for exactly that reason - a security gate that
      # cannot tell you what it found.
      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs'

  # ── Docker infrastructure audit (Hadolint) ──
  docker-infra-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Hadolint Dockerfile Audit
        run: |
          echo "=== RUNNING DOCKERFILE LINT ==="
          docker run --rm -i -v "${PWD}/scripts/.hadolint.yaml:/root/.hadolint.yaml" hadolint/hadolint < scripts/lint/Dockerfile.ci

  # ── API fuzz testing (Schemathesis, non-blocking) ──
  api-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt schemathesis==4.24.3
      - name: Warm up database schema
        env:
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: test-secret-key
          OWNER_PASSWORD: TestOwner@1234567890123456!
          APP_ENV: testing
          DEBUG: "true"
        run: |
          # Schema comes from Alembic, the same source the app uses. db.create_all()
            # built a competing definition of the tables from model metadata,
            # and it also had to run *after* create_app() - so the boot tried to
            # query tenants before any table existed and died first.
            flask db upgrade
      - name: Boot app and run Schemathesis (non-blocking)
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: test-secret-key
          OWNER_PASSWORD: TestOwner@1234567890123456!
          APP_ENV: testing
          ENABLE_SWAGGER_UI: "true"
          DEBUG: "true"
        run: |
          # Start app in background
          python -m flask run --port=5000 --host=0.0.0.0 &
          # Wait for app to be ready (max 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api-docs/openapi.json > /dev/null 2>&1; then
              echo "App ready after ${i}s"
              break
            fi
            sleep 1
          done
          # Fuzz public + documented API endpoints — spec served at /api-docs/openapi.json
          # Schemathesis v4: base-url + request-timeout live in scripts/schemathesis.toml (CLI flags removed).
          # ignored_auth: no session-auth context is configured for the fuzzer (covered by tenant-isolation
          # tests); negative_data_rejection: intentionally tolerant read endpoints 200 on junk input.
          # --config-file is a top-level CLI option and must precede the `run` subcommand.
          #
          # Stays non-blocking (a fuzz finding must not fail the build on its own),
          # but the finding is no longer swallowed: the old `|| echo` discarded
          # Schemathesis's own output, so the annotation said only "issues (ignored)"
          # and the actual failing check was invisible without reading raw logs.
          set +e
          schemathesis --config-file scripts/schemathesis.toml run http://localhost:5000/api-docs/openapi.json \
            --max-failures 1 \
            --exclude-checks ignored_auth,negative_data_rejection 2>&1 | tee schemathesis.log
          fuzz_rc=${PIPESTATUS[0]}
          set -e
          if [ "$fuzz_rc" -ne 0 ]; then
            echo "::warning title=api-fuzz::Schemathesis exited ${fuzz_rc} — failing checks (see schemathesis-log artifact):"
            grep -iE "failed|error|missing_property|not defined" schemathesis.log | head -15 || true
          fi

      - name: Upload api-fuzz log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: schemathesis-log
          path: schemathesis.log
          if-no-files-found: ignore
          retention-days: 14

  # ── Tenant isolation fuzzer ──
  tenant-isolation-fuzzer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tenant isolation fuzzer
        env:
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: test-secret-key
          OWNER_PASSWORD: TestOwner@1234567890123456!
          APP_ENV: testing
          DEBUG: "true"
        run: |
          pytest tests/unit/utils/test_tenant_isolation_fuzzer.py -v --tb=short

  # ── Lighthouse CI (web vitals, BLOCKING) ──
  # This gate measured nothing until now. Nothing in this job ran the migrations,
  # so the azad_test database had no tables; every context processor query raised
  # UndefinedTable and both audited URLs rendered error pages. `continue-on-error:
  # true` then discarded lhci's non-zero exit, so the job went green while
  # auditing a broken page. Separately, every assertion in lighthouserc.json was
  # "warn", so even without that, no score could ever fail the build.
  #
  # Now: schema is provisioned first, the server is started explicitly so a boot
  # failure surfaces its own log, both audited URLs are confirmed to return 200
  # before lhci runs, and the assertions are "error".
  lighthouse-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
      SECRET_KEY: test-secret-key
      OWNER_PASSWORD: TestOwner@1234567890123456!
      APP_ENV: testing
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt gunicorn
          npm install -g @lhci/cli
      - name: Provision schema
        run: |
          # Deliberately NOT `|| true`. An unmigrated database is exactly the
          # failure this gate was silently reporting as a pass.
          flask db upgrade
          python scripts/lint/check_model_schema_parity.py
      - name: Start app server
        run: |
          gunicorn --bind 0.0.0.0:5000 wsgi:app --daemon --error-logfile gunicorn.log
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5000/auth/login && break
            sleep 1
          done
      - name: Verify audited URLs before measuring
        run: |
          # lhci will happily audit an error page and report a score for it.
          # Require a real 200 on each URL that is about to be measured, after
          # following redirects, and refuse a redirect chain: a loop or a
          # redirect into a login prompt means the page under test is not the
          # page we think it is.
          #
          # These are the canonical paths. /login is a legacy alias registered in
          # main.py that 302s to /auth/login, so auditing it measured a redirect
          # rather than the login form.
          for url in http://localhost:5000/auth/login http://localhost:5000/; do
            read -r code hops <<< "$(curl -sSL -o /dev/null \
              -w '%{http_code} %{num_redirects}' "$url" || echo '000 99')"
            echo "  $url -> $code after $hops redirect(s)"
            if [ "$code" != "200" ]; then
              echo "::error::$url settled on $code, not 200"
              echo "--- gunicorn.log ---"
              cat gunicorn.log || true
              exit 1
            fi
            if [ "$hops" -gt 2 ]; then
              echo "::error::$url took $hops redirects - redirect chain, not a real page"
              exit 1
            fi
          done
      - name: Run Lighthouse CI
        run: |
          # collect/assert/upload are separate on purpose: `autorun` swallows a
          # non-zero collect when the server never came up, which is the same
          # silence as before. Explicit steps stop at the first failure.
          lhci collect --config=scripts/lighthouserc.json
          lhci assert --config=scripts/lighthouserc.json
          lhci upload --config=scripts/lighthouserc.json
      - name: Report measured scores
        run: python scripts/lint/report_lighthouse_scores.py
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci

  # ── E2E business flow tours (Playwright, BLOCKING) ──
  # Tours are BLOCKING: any failure fails the CI job (no continue-on-error).
  # Gate: npx playwright test --config=scripts/playwright.config.json --reporter=list
  # (JS tours; the old pytest-playwright POS tours never actually ran in CI —
  # their conftest STATE_DIR was off-by-one so every tour silently skipped —
  # and their assumptions did not match the real POS UI. They were removed.)
  e2e-tours:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt gunicorn playwright
          python -m playwright install --with-deps chromium
      - name: Install Node deps (for JS tours)
        run: |
          npm ci --no-audit --no-fund
          # The tours run via `npx playwright` (Node 1.62.x), whose expected
          # browser build differs from the one installed by pip's playwright.
          # Install the Node-side chromium as well (deps already installed above).
          npx playwright install chromium
      - name: Seed auth users and export states
        env:
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: test-secret-key
          OWNER_PASSWORD: TestOwner@1234567890123456!
          APP_ENV: testing
        run: |
          python scripts/auth/setup_test_users.py
      - name: Start app server for tours
        env:
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: test-secret-key
          OWNER_PASSWORD: TestOwner@1234567890123456!
          APP_ENV: testing
        run: |
          gunicorn --bind 0.0.0.0:5000 wsgi:app --daemon --error-logfile gunicorn.log
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:5000/auth/login >/dev/null 2>&1; then
              echo "App server is up (attempt $attempt)"
              exit 0
            fi
            sleep 3
          done
          echo "App server failed to start"; cat gunicorn.log; exit 1
      - name: Run Playwright JS tours (BLOCKING, --reporter=list)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5000
        run: |
          npx playwright test --config=scripts/playwright.config.json --reporter=list
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ── Comprehensive coverage report (backend + frontend) ──
  coverage-report:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install coverage
        run: pip install coverage

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: covdata-*
          path: coverage-data/

      - name: Download template coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: templates-*
          path: template-data/

      - name: Download frontend coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-frontend
          path: coverage-frontend/

      - name: Combine coverage data
        run: |
          shopt -s nullglob
          files=(coverage-data/covdata-*/coverage-data-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No coverage data artifacts found — test jobs may have failed early"
            exit 0
          fi
          coverage combine "${files[@]}"
          cp .coverage coverage-combined-data

      - name: Enforce coverage floor (COVERAGE_FAIL_UNDER=${{ env.COVERAGE_FAIL_UNDER }})
        if: hashFiles('.coverage') != ''
        run: coverage report --show-missing --fail-under=${{ env.COVERAGE_FAIL_UNDER }}

      - name: Generate comprehensive coverage report
        if: hashFiles('.coverage') != ''
        run: python scripts/coverage_report.py

      - name: Upload combined coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-combined
          path: coverage-combined-data
          if-no-files-found: ignore
          retention-days: 7
