    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
    - name: Install deps
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt gunicorn

        npm install -g @lhci/cli

        '
    - name: Wait for PostgreSQL to be ready
      run: "# pg_isready only checks if the port is open, not if the database\n# is fully initialized and accepting authentication. Wait until we\n# can actually connect and run a simple query.\nsleep 10  # Give PostgreSQL time to finish initialization\nfor i in $(seq 1 60); do\n  if PGPASSWORD=azad_test psql -h localhost -U azad_test -d azad_test -c \"SELECT 1\" > /dev/null 2>&1; then\n    echo \"PostgreSQL is ready (attempt $i)\"\n    exit 0\n  fi\n  echo \"Waiting for PostgreSQL... (attempt $i/60)\"\n  sleep 2\ndone\necho \"::error::PostgreSQL did not become ready in time\"\nexit 1\n"
    - name: Provision schema
      run: '# Deliberately NOT `|| true`. An unmigrated database is exactly the

        # failure this gate was silently reporting as a pass.

        flask db upgrade

        python scripts/lint/check_model_schema_parity.py

        '
    - name: Start app server
      run: "# One worker, several threads, on purpose.\n#\n# gunicorn's default is 2*CPU+1 workers, and every one of them runs\n# the whole create_app() path at boot: the seeding, the\n# seed-manifest probes and the tenant maintenance (9.6s measured on a\n# developer box). With the default worker count that is a herd of\n# seeders against one Postgres, still running while the audit starts.\n# It is also a lottery: a curl warms the worker that answered it, and\n# the audited request lands on whichever worker is free - a worker\n# that has never rendered the page pays the lazy imports, the Jinja\n# compile and the first DB connection inside the measured window\n# (454ms against 28ms warm, measured on the same process).\n#\n# One worker removes the lottery and the herd. Threads keep the\n# browser's parallel asset fetches parallel, so the page is not\n# penalised for the single process. This job measures a page, not a\n# throughput - tests/integration/test_sales_concurrency_load.py is\n# where\
        \ concurrency is measured.\ngunicorn --bind 0.0.0.0:5000 --worker-class gthread --workers 1 --threads 4 \\\n  --timeout 60 --access-logfile gunicorn-access.log \\\n  wsgi:app --daemon --error-logfile gunicorn.log\n\n# Readiness is a GATE, not a suggestion.\n#\n# The old loop ran 90 attempts and then fell out of the bottom of the\n# `for` whatever the server had answered, and the step exited 0\n# either way. A server that never came up was reported as a server\n# that did, and the failure surfaced three steps later as \"nothing\n# was measured\" - a message that named neither the server nor the\n# step that had lost it. The loop now has to END in a 200, and a\n# dead gunicorn ends it immediately instead of after 90 silent\n# attempts.\nready=0\ncode=000\nfor attempt in $(seq 1 90); do\n  # A redirect is not readiness: no -L here, so a 302 keeps the loop\n  # waiting instead of being read as \"the server is up\".\n  code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \\\n  \
        \  http://localhost:5000/auth/login || true)\n  code=${code:-000}\n  if [ \"$code\" = \"200\" ]; then\n    ready=1\n    echo \"::notice::gunicorn answered 200 on /auth/login after $attempt attempt(s)\"\n    break\n  fi\n  if ! pgrep -f gunicorn > /dev/null 2>&1; then\n    echo \"::error::gunicorn is no longer running - it died during boot (attempt $attempt, last status $code)\"\n    break\n  fi\n  if [ $((attempt % 10)) -eq 0 ]; then\n    echo \"::notice::still waiting for the server (attempt $attempt/90, last status $code)\"\n  fi\n  sleep 1\ndone\nif [ \"$ready\" != \"1\" ]; then\n  echo \"::error::The app server never answered 200 on /auth/login (last status: $code).\"\n  echo \"::error::The audit below cannot run against a server that is not up - read gunicorn.log for the boot traceback.\"\n  echo \"--- gunicorn.log ---\"\n  cat gunicorn.log 2>/dev/null || echo \"(no gunicorn.log - the server never wrote one)\"\n  exit 1\nfi\n"
    - name: Warm up and verify the audited pages
      run: "# The audit must measure a WARM page, so the server is warmed the way\n# a visitor's browser would warm it: every audited URL is fetched\n# until it answers 200, together with the static assets the page\n# references. The cold and the warm timings are printed, so the log\n# shows what the warm-up bought, and gunicorn-access.log carries the\n# server-side duration of every request - including the audited ones.\n#\n# The 200 is the point, not a formality: lhci will happily audit an\n# error page and report a score for it. Redirects are followed and\n# the settled response has to be 200, and a redirect chain is\n# refused: a loop or a redirect into a login prompt means the page\n# under test is not the page we think it is. These are the canonical\n# paths - /login is a legacy alias registered in main.py that 302s to\n# /auth/login, so auditing it measured a redirect rather than the\n# login form.\n#\n# What is NOT warmed: a third-party font stylesheet. There is none\n# left - every\
        \ family is served from this repository (static/fonts/)\n# - so the page no longer has a dependency the runner does not\n# control. See docs/LIGHTHOUSE_GATE.md for the measurement.\nset -uo pipefail\naudited_urls=(\"http://localhost:5000/auth/login\" \"http://localhost:5000/\")\nwarmup_rounds=3\nassets_file=\"${RUNNER_TEMP:-/tmp}/lh_assets.txt\"\necho \"Warming ${#audited_urls[@]} URL(s), $warmup_rounds round(s) each.\"\n\nfor url in \"${audited_urls[@]}\"; do\n  for round in $(seq 1 \"$warmup_rounds\"); do\n    # Every number comes out of a command substitution, and every\n    # variable starts at a defined value.\n    #\n    # The old line was\n    #   read -r code hops secs < <(curl ... -w '%{http_code} ...')\n    # and it killed the step SILENTLY on the first SUCCESSFUL\n    # request: curl's -w output has no trailing newline, so `read`\n    # reaches EOF and returns 1, and the runner's `bash -e` turns\n    # that into an exit before a single line was printed. Run\n    # 39674996405\
        \ died exactly there - 38ms, no output, exit 1 - and\n    # the job's only message was \"nothing was measured\" three steps\n    # downstream, naming neither the cause nor the step.\n    code=000\n    hops=0\n    secs=0\n    raw=$(curl -sSL -o /dev/null --max-time 30 \\\n      -w '%{http_code} %{num_redirects} %{time_total}\\n' \"$url\" 2>/dev/null) || raw=\"\"\n    if [ -n \"$raw\" ]; then\n      # A here-string always ends with a newline, so `read` returns 0.\n      IFS=' ' read -r code hops secs <<< \"$raw\" || true\n    fi\n    case \"$code\" in ''|*[!0-9]*) code=000 ;; esac\n    case \"$hops\" in ''|*[!0-9]*) hops=0 ;; esac\n    case \"$secs\" in ''|*[!0-9.]*) secs=0 ;; esac\n    if [ \"$code\" != \"200\" ]; then\n      echo \"::error::$url settled on $code, not 200 (round $round of $warmup_rounds)\"\n      echo \"--- gunicorn.log ---\"\n      cat gunicorn.log 2>/dev/null || echo \"(no gunicorn.log)\"\n      exit 1\n    fi\n    if [ \"$hops\" -gt 2 ]; then\n      echo \"::error::$url\
        \ took $hops redirects - redirect chain, not a real page\"\n      exit 1\n    fi\n    echo \"  $url warm#$round -> $code (${hops} redirect(s), ${secs}s)\"\n  done\n\n  # The assets this page references, so the first audited run does\n  # not pay for a cold asset path either.\n  curl -sSL \"$url\" \\\n    | grep -oE '(href|src)=\"/static/[^\"]+\"' \\\n    | sed -E 's/^[^\"]*\"([^\"]+)\"$/\\1/' \\\n    | sort -u > \"$assets_file\" || true\n  while read -r asset || [ -n \"$asset\" ]; do\n    [ -n \"$asset\" ] || continue\n    asset_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \\\n      \"http://localhost:5000$asset\" || true)\n    asset_code=${asset_code:-000}\n    echo \"  asset $asset -> $asset_code\"\n    if [ \"$asset_code\" != \"200\" ]; then\n      # A page that links an asset the server does not have is a\n      # broken page, and lhci would score it without complaining.\n      echo \"::error::$asset answered $asset_code - the page links an asset the server does\
        \ not serve\"\n      echo \"--- gunicorn.log ---\"\n      cat gunicorn.log 2>/dev/null || echo \"(no gunicorn.log)\"\n      exit 1\n    fi\n  done < \"$assets_file\"\ndone\necho \"Warm-up complete: ${#audited_urls[@]} URL(s) x $warmup_rounds round(s), all settled on 200.\"\n"
    - name: Run Lighthouse CI
      run: '# collect/assert/upload are separate on purpose: `autorun` swallows a

        # non-zero collect when the server never came up, which is the same

        # silence as before. Explicit steps stop at the first failure.

        #

        # collect runs 3 Lighthouse runs per URL (numberOfRuns in

        # scripts/lighthouserc.json). One run cannot tell a regression from a

        # cold server; three can, and the gate reads the median of them.

        lhci collect --config=scripts/lighthouserc.json

        # Persist before asserting. With upload after assert, a failing gate

        # skipped it, so `.lighthouseci/` was empty, the artifact was empty,

        # and the reports that explain the failure were the one thing thrown

        # away. Evidence first, verdict second.

        lhci upload --config=scripts/lighthouserc.json

        '
    - name: Report measured scores
      if: always()
      run: python scripts/lint/report_lighthouse_scores.py
    - name: Assert Lighthouse budgets
      working-directory: .lighthouse-gate
      run: lhci assert --config=../scripts/lighthouserc.json
    - name: Upload Lighthouse reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lighthouse-reports
        path: '.lighthouseci

          .lighthouse-gate

          gunicorn-access.log

          '
        include-hidden-files: true
