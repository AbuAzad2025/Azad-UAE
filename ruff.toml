target-version = "py312"
line-length = 120

exclude = [
    ".ci-repro",
    ".ci-repro2",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "S110", # try-except-pass
    "S112", # try-except-continue
    "E722", # bare except
]

[lint.per-file-ignores]
"tests/unit/test_grimoire_compliance.py" = ["E402"]
"scripts/visual_audit_render.py" = ["E402"]
"tests/**" = ["E501", "SIM117", "SIM102", "B904", "E402", "S110", "SIM115", "B007", "B023", "SIM112", "SIM113", "SIM108", "SIM103", "S112", "B017", "C408", "C416"]
"ai_knowledge/**" = ["E501"]
"utils/i18n.py" = ["E501"]
"utils/**" = ["E501", "SIM102", "B904", "E402", "SIM115", "B007", "SIM108", "SIM103", "SIM112", "SIM113", "C408", "C416"]
"app/**" = ["E501", "SIM102", "B904", "E402", "B007"]
"routes/**" = ["E501", "SIM102", "B904", "E402"]
"models/**" = ["E501"]
"migrations/**" = ["E501"]
"cli_commands.py" = ["E501", "B007"]
"services/**" = ["E501", "SIM102", "B904", "E402", "B007", "SIM112"]
"scripts/**" = ["E501", "SIM102", "SIM115", "UP031", "S110", "S112", "B023", "B007"]